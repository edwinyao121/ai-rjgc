<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OA办公系统</title>
<style>
:root {
  --bg: #F1F5F9; --surface: #FFFFFF; --sidebar-bg: #F8FAFC;
  --border: #E2E8F0; --text: #0F172A; --text-secondary: #475569;
  --primary: rgb(37, 99, 235); --primary-light: #DBEAFE;
  --primary-hover: rgb(30, 64, 175); --success: #10B981; --success-light: #ECFDF5;
  --warning: #F59E0B; --warning-light: #FFFBEB; --danger: #EF4444;
  --danger-light: #FEF2F2; --info: #3B82F6; --info-light: #EFF6FF;
  --shadow-sm: 0 1px 2px rgba(0,0,0,.05);
  --shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.06);
  --shadow-md: 0 4px 6px rgba(0,0,0,.05), 0 2px 4px rgba(0,0,0,.04);
  --shadow-lg: 0 10px 25px rgba(0,0,0,.08);
  --radius: 10px; --radius-sm: 6px; --radius-lg: 14px;
  --transition: 0.2s cubic-bezier(.4,0,.2,1);
  --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
  --mono: 'Cascadia Code', 'Fira Code', 'JetBrains Mono', monospace;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:var(--font);background:var(--bg);color:var(--text);display:flex;min-height:100vh;-webkit-font-smoothing:antialiased;}
::-webkit-scrollbar{width:6px;height:6px;}
::-webkit-scrollbar-thumb{background:#CBD5E1;border-radius:3px;}

/* Sidebar */
.sidebar{width:240px;min-width:240px;background:var(--sidebar-bg);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:20px 14px;gap:4px;position:sticky;top:0;height:100vh;overflow-y:auto;}
.logo{display:flex;align-items:center;gap:10px;padding:6px 10px 20px;font-size:17px;font-weight:700;color:var(--primary);letter-spacing:-0.3px;cursor:pointer;}
.logo .icon{width:34px;height:34px;background:linear-gradient(135deg,var(--primary),rgb(59, 130, 246));border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;}
.nav-section{font-size:11px;color:var(--text-muted);font-weight:600;text-transform:uppercase;letter-spacing:0.5px;padding:16px 10px 6px;}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--radius-sm);font-size:14px;color:var(--text-secondary);cursor:pointer;transition:var(--transition);font-weight:500;user-select:none;}
.nav-item:hover{background:#E2E8F0;color:var(--text);}
.nav-item.active{background:var(--primary-light);color:var(--primary);font-weight:600;}
.badge{margin-left:auto;background:var(--primary);color:#fff;font-size:11px;padding:2px 7px;border-radius:10px;font-weight:600;min-width:22px;text-align:center;}
.badge.warn{background:var(--warning);color:#fff;}

/* Main */
.main{flex:1;display:flex;flex-direction:column;min-width:0;}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 28px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10;}
.topbar-left{display:flex;align-items:center;gap:14px;}
.topbar h1{font-size:20px;font-weight:700;letter-spacing:-0.3px;}
.topbar .breadcrumb{font-size:13px;color:var(--text-muted);}
.topbar .breadcrumb span{color:var(--text-secondary);}
.topbar-right{display:flex;align-items:center;gap:16px;}
.topbar .avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,rgb(37, 99, 235),rgb(59, 130, 246));color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;cursor:pointer;}
.content{padding:28px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:24px;}

/* Cards */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:22px;box-shadow:var(--shadow-sm);transition:var(--transition);}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.card-title{font-size:15px;font-weight:700;}
.card-subtitle{font-size:12px;color:var(--text-muted);margin-top:2px;}
.card-hover:hover{box-shadow:var(--shadow-md);}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:var(--radius-sm);border:none;font-size:13px;font-weight:600;cursor:pointer;transition:var(--transition);font-family:var(--font);white-space:nowrap;}
.btn-primary{background:var(--primary);color:#fff;}
.btn-primary:hover{background:var(--primary-hover);transform:translateY(-1px);box-shadow:var(--shadow-md);}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text-secondary);}
.btn-outline:hover{background:#F1F5F9;}
.btn-ghost{background:transparent;color:var(--text-secondary);padding:6px 10px;}
.btn-ghost:hover{background:#F1F5F9;}
.btn-sm{padding:5px 10px;font-size:12px;}
.btn-xs{padding:3px 8px;font-size:11px;border-radius:4px;}
.btn-danger{background:var(--danger);color:#fff;}
.btn-success{background:var(--success);color:#fff;}

/* Tags */
.tag{display:inline-flex;align-items:center;padding:3px 10px;border-radius:12px;font-size:12px;font-weight:500;}
.tag-blue{background:var(--info-light);color:#1D4ED8;}
.tag-green{background:var(--success-light);color:#065F46;}
.tag-amber{background:var(--warning-light);color:#92400E;}
.tag-red{background:var(--danger-light);color:#991B1B;}
.tag-slate{background:#F1F5F9;color:#475569;}
.tag-purple{background:#F3E8FF;color:#7C3AED;}

/* Status */
.status-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;}
.status-dot.green{background:var(--success);}
.status-dot.amber{background:var(--warning);}
.status-dot.red{background:var(--danger);}
.status-dot.blue{background:var(--info);}

/* Stats */
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px;box-shadow:var(--shadow-sm);display:flex;align-items:center;gap:16px;transition:var(--transition);cursor:pointer;}
.stat-card:hover{box-shadow:var(--shadow-md);transform:translateY(-1px);}
.stat-icon{width:44px;height:44px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;font-size:20px;}
.stat-icon.indigo{background:var(--primary-light);color:var(--primary);}
.stat-icon.green{background:var(--success-light);color:var(--success);}
.stat-icon.amber{background:var(--warning-light);color:var(--warning);}
.stat-icon.blue{background:var(--info-light);color:var(--info);}
.stat-value{font-size:26px;font-weight:700;letter-spacing:-0.5px;transition:all .3s;}
.stat-label{font-size:13px;color:var(--text-muted);margin-top:2px;}

/* Grids */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px;}
.grid-70-30{display:grid;grid-template-columns:1fr 380px;gap:20px;}

/* Tables */
.table-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;padding:11px 14px;color:var(--text-muted);font-weight:600;font-size:12px;border-bottom:2px solid var(--border);}
td{padding:12px 14px;border-bottom:1px solid var(--border);vertical-align:middle;}
tr:hover td{background:#F8FAFC;}
.project-name{font-weight:600;color:var(--primary);cursor:pointer;}
.project-name:hover{text-decoration:underline;}

/* Kanban */
.kanban{display:flex;gap:16px;overflow-x:auto;padding:6px 6px 16px;min-height:400px;}
.kanban-col{min-width:280px;flex:1;background:var(--surface);border-radius:var(--radius-lg);padding:14px;transition:background .2s;box-shadow:var(--shadow-sm);border:1px solid var(--border);}
.kanban-col.drag-over{background:#E2E8F0;box-shadow:inset 0 0 0 2px var(--primary);}
.kanban-col-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;padding:0 4px;}
.kanban-col-title{font-size:14px;font-weight:700;}
.kanban-col-count{font-size:12px;color:var(--text-muted);background:var(--surface);padding:2px 8px;border-radius:10px;}
.kanban-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:10px;cursor:grab;box-shadow:var(--shadow-sm);transition:var(--transition);}
.kanban-card:hover{box-shadow:var(--shadow-md);transform:translateY(-1px);}
.kanban-card:active{cursor:grabbing;opacity:.85;transform:scale(.98);}
.kanban-card.dragging{opacity:.5;box-shadow:var(--shadow-lg);transform:rotate(2deg);}
.kanban-card .title{font-size:14px;font-weight:600;margin-bottom:6px;}
.kanban-card .meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--text-muted);}
.kanban-card .stage-bar{margin-top:8px;display:flex;align-items:center;gap:6px;font-size:11px;}

/* Pipeline */
.pipeline-wrap{overflow-x:auto;padding:10px 0;}
.pipeline{display:flex;align-items:flex-start;gap:0;min-width:max-content;padding:20px 10px;}
.pipeline-stage{display:flex;flex-direction:column;align-items:center;position:relative;}
.pipeline-node{display:flex;flex-direction:column;align-items:center;min-width:100px;cursor:pointer;position:relative;}
.pipeline-node-circle{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;border:3px solid var(--border);background:var(--surface);transition:all .3s;position:relative;z-index:2;}
.pipeline-node-circle svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.pipeline-node-circle.done{background:var(--success);border-color:var(--success);color:#fff;box-shadow:0 0 0 4px rgba(16,185,129,.2);}
.pipeline-node-circle.active{background:var(--primary-light);border-color:var(--primary);color:var(--primary);box-shadow:0 0 0 8px rgba(37, 99, 235,.15);animation:pulse-blue 2s infinite;}
.pipeline-node-circle.blocked{background:var(--danger-light);border-color:var(--danger);color:var(--danger);animation:pulse-red 2s infinite;}
.pipeline-node-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:20px;height:20px;border-radius:50%;background:#fff;z-index:1;}
.pipeline-node-label{font-size:13px;font-weight:600;margin-top:12px;text-align:center;max-width:100px;line-height:1.3;color:var(--text);letter-spacing:0.3px;}
.pipeline-node-sublabel{font-size:11px;color:var(--text-muted);margin-top:4px;text-align:center;font-weight:500;}
@keyframes pulse-blue{0%,100%{box-shadow:0 0 0 8px rgba(37, 99, 235,.15);}50%{box-shadow:0 0 0 16px rgba(37, 99, 235,.05);}}
@keyframes pulse-red{0%,100%{box-shadow:0 0 0 8px rgba(239,68,68,.2);}50%{box-shadow:0 0 0 16px rgba(239,68,68,.05);}}
.pipeline-node-gates{margin-top:8px;display:flex;gap:4px;}
.pipeline-gate-dot{width:8px;height:8px;border-radius:50%;}
.pipeline-gate-dot.pass{background:var(--success);}
.pipeline-gate-dot.fail{background:var(--danger);}
.pipeline-gate-dot.pending{background:#CBD5E1;}
.pipeline-node-agents{display:flex;gap:4px;margin-top:6px;}
.pipeline-agent-badge{font-size:9px;padding:2px 6px;border-radius:4px;background:var(--primary-light);color:var(--primary);font-weight:600;}

/* Agent Interaction Pipeline */
.pipeline-stage{min-width:130px;}
.pipeline-agent{display:flex;flex-direction:column;align-items:center;gap:4px;margin-top:8px;}
.pipeline-agent-avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;border:2px solid var(--border);background:var(--surface);transition:all .3s;position:relative;}
.pipeline-agent-avatar.working{border-color:var(--primary);animation:agent-work 1.5s ease infinite;}
.pipeline-agent-avatar.done{border-color:var(--success);background:var(--success-light);}
.pipeline-agent-avatar.idle{opacity:.5;}
.pipeline-agent-name{font-size:10px;color:var(--text-muted);font-weight:600;max-width:100px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
@keyframes agent-work{0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(37,99,235,.3);}50%{transform:scale(1.05);box-shadow:0 0 0 8px rgba(37,99,235,.1);}}

/* Agent Communication */
.pipeline-connector{position:relative;display:flex;align-items:center;justify-content:center;height:4px;width:60px;min-width:60px;margin:0 -4px;align-self:center;margin-top:26px;}
.pipeline-connector-line{width:100%;height:2px;background:var(--border);position:relative;overflow:hidden;}
.pipeline-connector-line.active{background:var(--primary);}
.pipeline-connector-line.active::after{content:'';position:absolute;top:0;left:-100%;width:40%;height:100%;background:linear-gradient(90deg,transparent,var(--primary),transparent);animation:flow-right 1.5s linear infinite;}
@keyframes flow-right{to{left:100%;}}
.pipeline-connector-msg{position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-size:9px;color:var(--primary);white-space:nowrap;background:var(--surface);padding:1px 6px;border-radius:4px;border:1px solid var(--primary-light);opacity:0;transition:opacity .3s;pointer-events:none;}
.pipeline-connector:hover .pipeline-connector-msg{opacity:1;}
.pipeline-connector.comm-active .pipeline-connector-msg{opacity:1;animation:msg-pop .5s ease;}
@keyframes msg-pop{from{opacity:0;transform:translateX(-50%) translateY(4px);}to{opacity:1;transform:translateX(-50%) translateY(0);}}

/* Human Review Checkpoint */
.pipeline-human-node{display:flex;flex-direction:column;align-items:center;gap:4px;margin-top:6px;padding:6px 8px;background:var(--warning-light);border:1px dashed var(--warning);border-radius:var(--radius-sm);cursor:pointer;transition:all .3s;}
.pipeline-human-node:hover{background:#FEF3C7;transform:scale(1.03);}
.pipeline-human-icon{width:28px;height:28px;border-radius:50%;background:var(--warning);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;}
.pipeline-human-label{font-size:9px;color:var(--warning);font-weight:700;}
.pipeline-human-status{font-size:8px;padding:1px 6px;border-radius:4px;font-weight:600;}
.pipeline-human-status.pending{background:var(--warning-light);color:var(--warning);}
.pipeline-human-status.approved{background:var(--success-light);color:var(--success);}
.pipeline-human-status.rejected{background:var(--danger-light);color:var(--danger);}

/* Activity Feed */
.activity-feed{max-height:280px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;}
.activity-item{display:flex;align-items:flex-start;gap:10px;padding:8px 10px;border-radius:var(--radius-sm);font-size:12px;line-height:1.5;animation:activity-in .4s ease;border-left:3px solid var(--border);background:var(--surface);}
.activity-item.agent-comm{border-left-color:var(--primary);background:#EFF6FF;}
.activity-item.agent-work{border-left-color:var(--success);background:#ECFDF5;}
.activity-item.human-action{border-left-color:var(--warning);background:#FFFBEB;}
.activity-item.gate-check{border-left-color:var(--info);background:#EFF6FF;}
.activity-item.gate-fail{border-left-color:var(--danger);background:#FEF2F2;}
@keyframes activity-in{from{opacity:0;transform:translateX(-8px);}to{opacity:1;transform:translateX(0);}}
.activity-time{font-size:10px;color:var(--text-muted);white-space:nowrap;min-width:40px;}
.activity-icon{width:20px;min-width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;}
.activity-icon.agent{background:var(--primary-light);color:var(--primary);}
.activity-icon.human{background:var(--warning-light);color:var(--warning);}
.activity-icon.gate{background:var(--success-light);color:var(--success);}
.activity-icon.fail{background:var(--danger-light);color:var(--danger);}
.activity-text{flex:1;color:var(--text-secondary);}
.activity-text strong{color:var(--text);}

/* Agent Interaction Overlay */
.agent-interaction-overlay{position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:10;}
.agent-msg-particle{position:absolute;width:8px;height:8px;border-radius:50%;background:var(--primary);animation:particle-fly 1s ease forwards;opacity:0;}
@keyframes particle-fly{0%{opacity:1;transform:translate(0,0) scale(1);}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(0);}}

/* Gates */
.gate-item{display:flex;align-items:flex-start;gap:12px;padding:14px;border-radius:var(--radius);border:1px solid var(--border);margin-bottom:10px;background:var(--surface);transition:all .3s;}
.gate-item.fail-anim{animation:shake .4s ease;}
@keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-4px);}75%{transform:translateX(4px);}}
.gate-icon{width:36px;min-width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;}
.gate-icon.pass{background:var(--success-light);color:var(--success);}
.gate-icon.warn{background:var(--warning-light);color:var(--warning);}
.gate-icon.fail{background:var(--danger-light);color:var(--danger);}
.gate-info{flex:1;}
.gate-name{font-weight:600;font-size:14px;}
.gate-desc{font-size:12px;color:var(--text-muted);margin-top:2px;}
.gate-detail{font-size:12px;color:var(--text-secondary);margin-top:6px;font-family:var(--mono);background:#F8FAFC;padding:6px 10px;border-radius:4px;}

/* Progress */
.progress-bar{height:6px;background:#E2E8F0;border-radius:3px;overflow:hidden;}
.progress-bar .fill{height:100%;border-radius:3px;transition:width .5s ease;}
.fill.green{background:var(--success);}
.fill.indigo{background:var(--primary);}
.fill.amber{background:var(--warning);}
.fill.red{background:var(--danger);}

/* Timeline */
.timeline{position:relative;padding-left:24px;}
.timeline::before{content:'';position:absolute;left:8px;top:0;bottom:0;width:2px;background:var(--border);}
.timeline-item{position:relative;margin-bottom:18px;}
.timeline-item::before{content:'';position:absolute;left:-20px;top:3px;width:10px;height:10px;border-radius:50%;background:var(--primary);border:2px solid var(--surface);z-index:1;}
.timeline-item .time{font-size:11px;color:var(--text-muted);}
.timeline-item .desc{font-size:13px;margin-top:2px;line-height:1.4;}

/* Chat */
.chat-container{display:flex;flex-direction:column;height:440px;border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;background:var(--surface);}
.chat-header{padding:14px 20px;border-bottom:1px solid var(--border);font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px;}
.chat-messages{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:14px;}
.chat-msg{display:flex;gap:12px;max-width:85%;animation:msgIn .3s ease;}
@keyframes msgIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
.chat-msg.user{align-self:flex-end;flex-direction:row-reverse;}
.chat-msg .avatar-sm{width:32px;min-width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;}
.chat-msg .avatar-sm.agent{background:var(--primary-light);color:var(--primary);}
.chat-msg .avatar-sm.human{background:#DBEAFE;color:#1E40AF;}
.chat-bubble{padding:12px 16px;border-radius:12px;font-size:13px;line-height:1.6;}
.chat-msg.agent .chat-bubble{background:#F1F5F9;}
.chat-msg.user .chat-bubble{background:var(--primary);color:#fff;}
.chat-msg .chat-meta{font-size:11px;color:var(--text-muted);margin-top:4px;}
.chat-input-area{padding:14px 20px;border-top:1px solid var(--border);display:flex;gap:10px;}
.chat-input-area input{flex:1;padding:10px 14px;border:1px solid var(--border);border-radius:20px;font-size:13px;outline:none;font-family:var(--font);}
.chat-input-area input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(30,64,175,.1);}

/* Mind map */
.mindmap-container{background:#FAFBFC;border:1px solid var(--border);border-radius:var(--radius);min-height:240px;overflow:auto;position:relative;}

/* Tabs */
.tabs{display:flex;gap:2px;border-bottom:2px solid var(--border);margin-bottom:20px;}
.tab{padding:10px 20px;font-size:13px;font-weight:600;color:var(--text-muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:var(--transition);user-select:none;}
.tab.active{color:var(--primary);border-bottom-color:var(--primary);}
.tab:hover{color:var(--text-secondary);}

/* Rule config */
.rule-config-item{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border:1px solid var(--border);border-radius:var(--radius);margin-bottom:8px;transition:var(--transition);}
.rule-config-item:hover{background:#F8FAFC;}
.rule-config-item .rule-name{font-weight:600;font-size:13px;}
.rule-config-item .rule-desc{font-size:12px;color:var(--text-muted);}
.toggle{width:44px;height:24px;border-radius:12px;background:#CBD5E1;cursor:pointer;transition:var(--transition);position:relative;min-width:44px;}
.toggle.on{background:var(--success);}
.toggle::after{content:'';position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:var(--transition);box-shadow:var(--shadow-sm);}
.toggle.on::after{left:22px;}

/* Review */
.review-card{border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:10px;transition:var(--transition);}
.review-card:hover{box-shadow:var(--shadow-sm);}
.review-card .review-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.review-card .reviewer{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;}

/* Artifacts */
.artifact-file{display:flex;align-items:center;gap:10px;padding:12px 16px;border:1px solid var(--border);border-radius:var(--radius);margin-bottom:8px;cursor:pointer;transition:var(--transition);}
.artifact-file:hover{background:#F8FAFC;border-color:var(--primary);}
.artifact-file .file-icon{font-size:20px;}
.artifact-file .file-name{font-weight:600;font-size:13px;}
.artifact-file .file-meta{font-size:11px;color:var(--text-muted);}

/* Code block */
.code-block{background:#1E293B;color:#E2E8F0;border-radius:var(--radius);padding:16px;font-family:var(--mono);font-size:12px;overflow-x:auto;line-height:1.6;white-space:pre-wrap;}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.4);display:flex;align-items:center;justify-content:center;z-index:100;backdrop-filter:blur(2px);animation:fadeIn .2s;}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
.modal{background:var(--surface);border-radius:var(--radius-lg);padding:28px;width:680px;max-width:95vw;max-height:85vh;overflow-y:auto;box-shadow:var(--shadow-lg);animation:slideUp .25s ease;}
@keyframes slideUp{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}
.modal h3{font-size:18px;font-weight:700;margin-bottom:20px;}
.form-group{margin-bottom:16px;}
.form-group label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--text-secondary);}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:13px;font-family:var(--font);outline:none;transition:var(--transition);}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(79,70,229,.1);}
.form-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;}

/* Toast */
.toast{position:fixed;top:20px;right:20px;z-index:200;padding:14px 20px;border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow-lg);font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px;animation:slideIn .3s ease;border-left:4px solid var(--success);}
.toast.error{border-left-color:var(--danger);}
@keyframes slideIn{from{opacity:0;transform:translateX(40px);}to{opacity:1;transform:translateX(0);}}

/* Page visibility */
.page{display:none;}
.page.active{display:flex;flex-direction:column;gap:24px;}

/* AI Analysis Result */
.ai-result{background:var(--primary-light);border:1px solid #BFDBFE;border-radius:var(--radius);padding:16px;margin-top:8px;}

/* Responsive */
@media(max-width:1200px){.stats-grid{grid-template-columns:repeat(2,1fr);}.grid-2,.grid-70-30{grid-template-columns:1fr;}.sidebar{width:200px;min-width:200px;}}

/* Empty state */
.empty-state{text-align:center;padding:40px;color:var(--text-muted);}
.empty-state .icon{font-size:48px;margin-bottom:12px;}

/* Highlight */
.highlight{animation:highlight 1.5s ease;}
@keyframes highlight{0%{background:var(--warning-light);}100%{background:transparent;}}

/* Agent Float Widget */
.agent-float-widget{position:fixed;bottom:24px;right:24px;z-index:150;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;transition:all .3s;}
.agent-float-widget:hover{transform:translateY(-3px);}
.agent-float-icon{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,#1E40AF,#3B82F6);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:0 4px 14px rgba(30,64,175,.4);position:relative;}
.agent-float-pulse{position:absolute;width:52px;height:52px;border-radius:50%;background:#1E40AF;opacity:.4;animation:agentPulse 2s infinite;}
@keyframes agentPulse{0%{transform:scale(1);opacity:.4;}100%{transform:scale(1.5);opacity:0;}}
.agent-float-label{font-size:11px;font-weight:600;color:#475569;background:#fff;padding:3px 10px;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.1);}

function animateValue(el, start, end, duration) {
  const startTime = performance.now();
  function update(ts) {
    const progress = Math.min((ts - startTime) / duration, 1);
    el.textContent = Math.floor(start + (end - start) * progress);
    if (progress < 1) requestAnimationFrame(update);
  }
  requestAnimationFrame(update);
}

function updateBadges() {
  const tasks = getProjectTasks(state.activeProjectId);
  const execTasks = tasks.filter(t => t.status === 'executing' || t.status === 'review');
  const blockedGates = execTasks.filter(t => {
    if (t.stageCurrent < 0 || !t.stageGates[t.stageCurrent]) return false;
    return t.stageGates[t.stageCurrent].some(g => g === 0);
  });
  const pendingReviews = state.reviews.filter(r => r.status === 'pending');
  document.getElementById('badgeTasks').textContent = tasks.filter(t => t.status !== 'done').length;
  document.getElementById('badgeGates').textContent = blockedGates.length;
  document.getElementById('badgeReviews').textContent = pendingReviews.length;
}

function renderKanban(container) {

    { key:'executing', title:'执行中', icon:'&#8635;', color:'border-left:3px solid var(--primary);' },
    { key:'review', title:'待评审', icon:'&#9745;', color:'border-left:3px solid var(--warning);' },
    { key:'done', title:'已完成', icon:'&#10003;', color:'' },
  ];

  container.innerHTML = `
    <div style="display:flex;align-items:center;justify-content:space-between;">
      <div><div style="font-size:22px;font-weight:700;">任务看板</div><div style="font-size:13px;color:var(--text-muted);margin-top:4px;">项目: ${project.name} &nbsp;|&nbsp; ${project.desc}</div></div>
      <div style="display:flex;gap:10px;">

        <button class="btn btn-primary btn-sm" onclick="showNewTaskModal()">+ 新建任务</button>
      </div>
    </div>
    <div class="kanban" id="kanbanBoard">${statusCols.map(col => {
      const colTasks = tasks.filter(t => t.status === col.key);
      return `<div class="kanban-col" data-status="${col.key}" ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)" ondrop="handleDrop(event)">
        <div class="kanban-col-header"><span class="kanban-col-title">${col.icon} ${col.title}</span><span class="kanban-col-count">${colTasks.length}</span></div>
        ${colTasks.map(t => renderKanbanCard(t, col)).join('')}
      </div>`;
    }).join('')}</div>`;
}

function renderKanbanCard(t, col) {
  const statusKey = col ? col.key : t.status;
  const style = statusKey === 'executing' ? 'border-left:3px solid var(--primary);' : (statusKey === 'review' ? 'border-left:3px solid var(--warning);' : '');
  const stageInfo = t.stageCurrent >= 0 && t.stageNames.length > 0
    ? `<div class="stage-bar"><span class="status-dot ${t.status==='executing'?'blue':'amber'}"></span>当前: ${t.stageNames[t.stageCurrent]} ${t.stageCurrent>=0&&t.stageGates[t.stageCurrent]&&t.stageGates[t.stageCurrent].some(g=>g===0)?'<span style="color:var(--danger);">(门禁阻断)</span>':''}<div class="progress-bar" style="width:80px;margin-left:6px;"><div class="fill indigo" style="width:${Math.round((t.stageCurrent+1)/t.stageNames.length*100)}%;"></div></div></div>`
    : (statusKey === 'planning' && t.stageNames.length > 0 ? `<div class="stage-bar"><span class="status-dot green"></span>${t.stageNames.length}阶段已规划</div>` : '');
  return `
    <div class="kanban-card" style="${style}" draggable="true" data-task-id="${t.id}" ondragstart="handleDragStart(event)" ondragend="handleDragEnd(event)" onclick="navigate('pipeline-view',{tid:'${t.id}'})">
      <div class="title">${t.title}</div>
      <div class="meta">
        <span class="tag ${t.type==='Feature'?'tag-blue':t.type==='Refactor'?'tag-slate':'tag-purple'}">${t.type}</span>
        ${t.aiCreated?'<span class="tag tag-green">AI生成</span>':''}
        <span>${t.priority}</span>
        <span>&#9201; ${t.estimate}</span>
      </div>
      ${stageInfo}
    </div>`;
}

// Drag & Drop
let dragTaskId = null;
function handleDragStart(e) {
  dragTaskId = e.target.dataset.taskId;
  e.target.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
}
function handleDragEnd(e) { e.target.classList.remove('dragging'); dragTaskId = null; }
function handleDragOver(e) { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; e.currentTarget.classList.add('drag-over'); }
function handleDragLeave(e) { e.currentTarget.classList.remove('drag-over'); }
function handleDrop(e) {
  e.preventDefault();
  e.currentTarget.classList.remove('drag-over');
  const newStatus = e.currentTarget.dataset.status;
  if (!dragTaskId || !newStatus) return;
  const task = getTask(dragTaskId);
  if (!task) return;
  const oldStatus = task.status;

  // Validate transition
  const validTransitions = {
    'backlog': ['planning'],
    'planning': ['backlog', 'executing'],
    'executing': ['review'],
    'review': ['executing', 'done'],
    'done': ['review'],
  };
  if (oldStatus === newStatus) return;
  if (!validTransitions[oldStatus] || !validTransitions[oldStatus].includes(newStatus)) {
    toast(`不允许从 "${getStatusLabel(oldStatus)}" 直接流转到 "${getStatusLabel(newStatus)}"`, true);
    return;
  }

  // Special: planning -> executing: auto-plan pipeline
  if (oldStatus === 'planning' && newStatus === 'executing') {
    autoPlanPipeline(task);
    task.stageCurrent = 0;
  }

  // Special: review -> done: verify all gates pass
  if (oldStatus === 'review' && newStatus === 'done') {
    if (task.stageCurrent >= 0 && task.stageGates[task.stageCurrent] && task.stageGates[task.stageCurrent].some(g => g === 0)) {
      toast('当前阶段门禁未全部通过，无法完成', true);
      return;
    }
  }

  task.status = newStatus;

  // Update project progress
  if (newStatus === 'done') {
    const project = getProject(task.pid);
    if (project && project.stagesDone < project.stagesTotal) project.stagesDone++;
  }

  toast(`任务 "${task.title}" 已移至 "${getStatusLabel(newStatus)}"`);
  if (state.activePage === 'kanban') renderKanban(document.getElementById('mainContent'));
  updateBadges();
}

function getStatusLabel(s) {
  const map = { backlog:'待办', planning:'规划中', executing:'执行中', review:'待评审', done:'已完成' };
  return map[s] || s;
}

function autoPlanPipeline(task) {
  const isFeature = task.type === 'Feature' || task.type === 'Enhancement';
  const isRefactor = task.type === 'Refactor';
  if (isFeature) {
    task.stageNames = ['需求分析','需求拆解','方案设计','代码生成','代码审查','单元测试','质量检查','验收确认'];
  } else if (isRefactor) {
    task.stageNames = ['方案设计','代码生成','代码审查','单元测试','质量检查','验收确认'];
  } else {
    task.stageNames = ['需求分析','代码生成','代码审查','测试','验收确认'];
  }
  task.stages = new Array(task.stageNames.length).fill(0);
  task.stageGates = task.stageNames.map(name => {
    const defs = state.gateDefs[name] || [];
    return defs.map(() => 0); // all pending initially
  });
  toast(`AI 已自动规划 ${task.stageNames.length} 个执行阶段`);
}

    '持续监控': '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>',
    '集成测试': '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="9" height="9"/><rect x="13" y="2" width="9" height="9"/><rect x="13" y="13" width="9" height="9"/><rect x="2" y="13" width="9" height="9"/></svg>'
  };

  // Human review stages
  const humanReviewStages = ['方案设计', '代码审查'];
  // Build pipeline HTML
  let html = '';
  task.stageNames.forEach((name, i) => {
    let cls = 'pending';
    if (task.stages[i] >= 1) cls = 'done';
    else if (i === task.stageCurrent) {
      const hasBlocked = task.stageGates[i] && task.stageGates[i].some(g => g === 0);
      cls = hasBlocked ? 'blocked' : 'active';
    }
    const icon = stageIcons[name] || '📦';
    const agent = stageAgents[name] || { name: '未知 Agent', avatar: '🤖', color: '#94A3B8' };
    const agentState = task.stages[i] >= 1 ? 'done' : (i === task.stageCurrent ? 'working' : 'idle');
    const hasHumanReview = humanReviewStages.includes(name) && i <= task.stageCurrent;
    const review = state.reviews.find(r => r.tid === task.id && r.stage === i);
    const reviewStatus = review ? review.status : (hasHumanReview && task.stages[i] >= 1 ? 'approved' : null);

    // Stage node with agent
    html += `<div class="pipeline-stage">
      <div class="pipeline-node" onclick="focusStage(${i})">
        <div class="pipeline-node-center"></div>
        <div class="pipeline-node-circle ${cls}">${icon}</div>
        <div class="pipeline-node-label">${name}</div>
        <div class="pipeline-node-sublabel">${task.stages[i] >= 1 ? '(已完成)' : i === task.stageCurrent ? '(执行中)' : '(待执行)'}</div>
        <div class="pipeline-node-gates">${(task.stageGates[i]||[]).map(g => `<span class="pipeline-gate-dot ${g===1?'pass':g===0?'fail':'pending'}"></span>`).join('')}</div>
      </div>
      <div class="pipeline-agent">
        <div class="pipeline-agent-avatar ${agentState}" style="border-color:${agentState==='done'?agent.color:'var(--border)'};background:${agentState==='done'?agent.color+'15':'var(--surface)'};">
          <span>${agent.avatar}</span>
        </div>
        <div class="pipeline-agent-name" style="color:${agentState==='working'?agent.color:'var(--text-muted)'};">${agent.name}</div>
      </div>
      ${hasHumanReview ? `
      <div class="pipeline-human-node" onclick="event.stopPropagation();${review ? `focusStage(${i})` : `requestReviewForStage(${i})`}">
        <div class="pipeline-human-icon">👤</div>
        <div class="pipeline-human-label">人工评审</div>
        ${reviewStatus ? `<span class="pipeline-human-status ${reviewStatus}">${reviewStatus==='approved'?'已通过':reviewStatus==='rejected'?'已驳回':reviewStatus==='changes'?'需修改':'待审批'}</span>` : '<span class="pipeline-human-status pending">待审批</span>'}
      </div>` : ''}
    </div>`;

    // Connector with agent communication
    if (i < task.stageNames.length - 1) {
      const nextName = task.stageNames[i + 1];
      const commKey = `${name}→${nextName}`;
      const commMsg = agentCommMessages[commKey] || '传递产出物';
      const isCommActive = task.stages[i] >= 1 && task.stages[i + 1] === 0;
      const isCommDone = task.stages[i] >= 1 && task.stages[i + 1] >= 1;
      html += `<div class="pipeline-connector ${isCommActive?'comm-active':''}">
        <div class="pipeline-connector-line ${isCommActive||isCommDone?'active':''}"></div>
        <div class="pipeline-connector-msg">${commMsg}</div>
      </div>`;
    }
  });
  container.innerHTML = html;
}

function renderActivityFeed(task) {
  const feedContainer = document.getElementById('activityFeed');
  if (!feedContainer) return;
  const logs = getActivityLogs(task);
  feedContainer.innerHTML = logs.length === 0
    ? '<div style="padding:12px;color:var(--text-muted);font-size:12px;">暂无活动记录</div>'
    : logs.map(log => `
      <div class="activity-item ${log.type}">
        <span class="activity-time">${log.time}</span>
        <span class="activity-icon ${log.iconType}">${log.icon}</span>
        <span class="activity-text">${log.text}</span>
      </div>`).join('');
}

function getActivityLogs(task) {
  const key = task.id;
  if (!activityLogs[key]) {
    activityLogs[key] = generateInitialActivityLogs(task);
  }
  return activityLogs[key];
}

function generateInitialActivityLogs(task) {
  const logs = [];
  const now = Date.now();
  const fmt = (s) => new Date(now - s * 1000).toLocaleString('zh-CN', {hour:'2-digit',minute:'2-digit',second:'2-digit'});

  task.stageNames.forEach((name, i) => {
    if (i > task.stageCurrent) return;
    const agent = stageAgents[name] || { name: '未知 Agent', avatar: '🤖' };
    const isDone = task.stages[i] >= 1;
    const isActive = i === task.stageCurrent;
    const baseTime = (task.stageCurrent - i) * 300;

    if (isDone || isActive) {
      logs.push({
        time: fmt(baseTime + 120),
        type: 'agent-work',
        icon: agent.avatar,
        iconType: 'agent',
        text: `<strong>${agent.name}</strong> 开始执行「${name}」阶段`
      });
    }

    // Gate check logs
    if (task.stageGates[i] && (isDone || isActive)) {
      const gateDefs = state.gateDefs[name] || [];
      task.stageGates[i].forEach((g, gi) => {
        if (g === 1) {
          logs.push({
            time: fmt(baseTime + 80),
            type: 'gate-check',
            icon: '✓',
            iconType: 'gate',
            text: `门禁「${gateDefs[gi]?.name || '检查'}」<strong>通过</strong>`
          });
        } else if (g === 0 && isActive) {
          logs.push({
            time: fmt(baseTime + 80),
            type: 'gate-fail',
            icon: '✗',
            iconType: 'fail',
            text: `门禁「${gateDefs[gi]?.name || '检查'}」<strong>阻断</strong> — ${gateDefs[gi]?.desc || ''}`
          });
        }
      });
    }

    // Agent completion
    if (isDone && i < task.stageCurrent) {
      logs.push({
        time: fmt(baseTime + 30),
        type: 'agent-work',
        icon: '✓',
        iconType: 'agent',
        text: `<strong>${agent.name}</strong> 完成「${name}」阶段`
      });
      // Communication to next agent
      if (i < task.stageNames.length - 1) {
        const nextAgent = stageAgents[task.stageNames[i + 1]] || { name: '未知 Agent' };
        const commKey = `${name}→${task.stageNames[i + 1]}`;
        logs.push({
          time: fmt(baseTime + 20),
          type: 'agent-comm',
          icon: '→',
          iconType: 'agent',
          text: `<strong>${agent.name}</strong> → <strong>${nextAgent.name}</strong>: ${agentCommMessages[commKey] || '传递产出物'}`
        });
      }
    }

    // Human review logs
    const review = state.reviews.find(r => r.tid === task.id && r.stage === i);
    if (review) {
      const statusText = review.status === 'approved' ? '通过' : review.status === 'rejected' ? '驳回' : review.status === 'changes' ? '需修改' : '待审批';
      logs.push({
        time: fmt(baseTime + 50),
        type: 'human-action',
        icon: '👤',
        iconType: 'human',
        text: `<strong>${review.reviewer}</strong> 对「${name}」评审: <strong>${statusText}</strong> — ${review.desc}`
      });
    }
  });

  // Sort by time (most recent first)
  logs.sort((a, b) => b.time.localeCompare(a.time));
  return logs;
}

function addActivityLog(taskId, type, icon, iconType, text) {
  if (!activityLogs[taskId]) activityLogs[taskId] = [];
  const now = new Date().toLocaleString('zh-CN', {hour:'2-digit',minute:'2-digit',second:'2-digit'});
  activityLogs[taskId].unshift({ time: now, type, icon, iconType, text });
}

function requestReviewForStage(stageIdx) {
  const task = getTask(state.activeTaskId);
  if (!task) return;
  const stageName = task.stageNames[stageIdx];
  const existing = state.reviews.find(r => r.tid === task.id && r.stage === stageIdx);
  if (existing) {
    toast('该阶段已有评审任务', true);
    return;
  }
  const reviewers = ['王工','李工','赵工','刘工'];
  const rv = {
    id: 'r' + (reviewIdCounter++),
    tid: task.id,
    stage: stageIdx,
    stageName,
    reviewer: reviewers[Math.floor(Math.random() * reviewers.length)],
    status: 'pending',
    desc: `${stageName}阶段产出物需要人工评审确认`
  };
  state.reviews.push(rv);
  addActivityLog(task.id, 'human-action', '👤', 'human', `<strong>${rv.reviewer}</strong> 被分配为「${stageName}」评审人`);
  toast(`已创建评审任务，评审人: ${rv.reviewer}`);
  renderPipelineGraph(task, {});
  updateBadges();
}

function focusStage(idx) {
  const task = getTask(state.activeTaskId);
  if (!task || idx > task.stageCurrent + 1) { toast('请先完成当前阶段', true); return; }
  state._focusStage = idx;
  renderTabContent(task, document.querySelector('#stageDetailPanel .tab.active').dataset.tab);
}

function renderTabContent(task, tab) {
  const container = document.getElementById('tabContent');
  if (!container) return;
  const stageIdx = state._focusStage !== undefined ? state._focusStage : task.stageCurrent;
  if (stageIdx < 0 || !task.stageNames[stageIdx]) { container.innerHTML = '<div style="padding:20px;color:var(--text-muted);">暂无阶段数据</div>'; return; }
  const stageName = task.stageNames[stageIdx];
  const gates = task.stageGates[stageIdx] || [];
  const gateDefs = state.gateDefs[stageName] || [];

  if (tab === 'gates') {
    if (gateDefs.length === 0) { container.innerHTML = '<div style="padding:20px;color:var(--text-muted);">该阶段无门禁规则</div>'; return; }
    container.innerHTML = `
      <div style="margin-bottom:12px;font-size:13px;font-weight:600;">当前阶段: ${stageName} ${task.stages[stageIdx]>=1?'(已完成)':task.stageCurrent===stageIdx?'(执行中)':'(待执行)'}</div>
      ${gateDefs.map((g, i) => {
        const status = gates[i] === 1 ? 'pass' : (gates[i] === 0 && task.stageCurrent === stageIdx ? 'fail' : 'pending');
        const statusTag = status === 'pass' ? '<span class="tag tag-green">通过</span>' : (status === 'fail' ? '<span class="tag tag-red">阻断</span>' : '<span class="tag tag-slate">待检查</span>');
        const detailHtml = g.detail && status === 'fail' ? `<div class="gate-detail" style="color:var(--danger);">${g.detail}</div>` : (status === 'pass' ? `<div class="gate-detail">通过 · 0 错误 · 执行耗时 ${(Math.random()*5+1).toFixed(1)}s</div>` : '');
        return `<div class="gate-item${status==='fail'?' fail-anim':''}">
          <div class="gate-icon ${status==='pass'?'pass':status==='fail'?'fail':'warn'}">${status==='pass'?'&#10003;':status==='fail'?'&#10007;':'&#9888;'}</div>
          <div class="gate-info"><div class="gate-name">${g.name}</div><div class="gate-desc">${g.desc}</div>${detailHtml}</div>${statusTag}
        </div>`;
      }).join('')}
      ${task.stageCurrent === stageIdx && gates.some(g => g === 0) ? `
        <div style="margin-top:16px;padding:16px;background:var(--danger-light);border-radius:var(--radius);font-size:13px;">
          <strong>&#9888; AI 修复建议：</strong>
          <ul style="margin:8px 0 0 18px;line-height:1.6;" id="aiSuggestions"></ul>
          <button class="btn btn-primary btn-sm fix-gate-btn" style="margin-top:10px;" onclick="autoFixGates('${state.activeTaskId}', ${stageIdx})">&#9881; 让 Agent 自动修复</button>
          <button class="btn btn-outline btn-sm" style="margin-top:10px;margin-left:6px;" onclick="openChatForFix()">&#9998; 对话修改</button>
        </div>` : ''}
    `;
    // AI suggestions
    const sugList = document.getElementById('aiSuggestions');
    if (sugList) {
      if (stageName === '代码审查') {
        sugList.innerHTML = `<li><strong>QueryOptimizer.process()</strong>: 提取子查询优化逻辑为独立方法，可降低圈复杂度至 10</li><li><strong>SQLBuilder.build()</strong>: 将 WHERE 子句和 JOIN 子句构建逻辑独立，预计行数降至 65</li>`;
      } else if (stageName === '单元测试') {
        sugList.innerHTML = `<li>补充边界值测试用例，预计覆盖率可提升至 85%</li><li>添加异常路径测试，覆盖 try-catch 分支</li>`;
      } else {
        sugList.innerHTML = `<li>Agent 将自动分析失败原因并生成修复方案</li>`;
      }
    }
  } else if (tab === 'mindmap') {
    const logs = getActivityLogs(task);
    const stageLogs = logs.filter(log => log.text.includes(stageName) || log.text.includes(stageAgents[stageName]?.name || ''));
    const legendHtml = `
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;">
        <span class="tag tag-blue"><span class="status-dot blue"></span>Agent 通信</span>
        <span class="tag tag-green"><span class="status-dot green"></span>Agent 工作</span>
        <span class="tag tag-amber"><span class="status-dot amber"></span>人工操作</span>
        <span class="tag tag-red"><span class="status-dot red"></span>门禁阻断</span>
        <span class="tag tag-slate"><span class="status-dot"></span>门禁通过</span>
      </div>`;
    const activityHtml = stageLogs.length === 0
      ? '<div style="padding:12px;color:var(--text-muted);font-size:12px;text-align:center;">暂无该阶段活动记录</div>'
      : `<div class="activity-feed" style="max-height:200px;">${stageLogs.map(log => `
          <div class="activity-item ${log.type}">
            <span class="activity-time">${log.time}</span>
            <span class="activity-icon ${log.iconType}">${log.icon}</span>
            <span class="activity-text">${log.text}</span>
          </div>`).join('')}</div>`;
    container.innerHTML = `
      <div style="margin-bottom:8px;font-size:13px;font-weight:600;">${stageName} Agent 工作流</div>
      <div class="mindmap-container" id="mindmapSvg" style="min-height:240px;"></div>
      <div style="margin-top:16px;border-top:1px solid var(--border);padding-top:12px;">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">
          <div style="font-size:13px;font-weight:600;">活动日志</div>
          ${legendHtml}
        </div>
        ${activityHtml}
      </div>`;
    setTimeout(() => drawMindMap(stageName), 100);
  } else if (tab === 'artifacts') {
    const artifacts = getArtifacts(stageName);
    container.innerHTML = `
      <div style="margin-bottom:12px;font-size:13px;font-weight:600;">阶段产出物 — ${stageName}</div>
      ${artifacts.map(a => `
        <div class="artifact-file" onclick="previewArtifact('${a.name}')">
          <div class="file-icon">${a.icon}</div>
          <div style="flex:1;"><div class="file-name">${a.name}</div><div class="file-meta">${a.meta}</div></div>
          <button class="btn btn-ghost btn-xs">&#9654; 预览</button>
        </div>`).join('')}
      <div id="artifactPreview"></div>`;
  }
}

function drawMindMap(stageName) {
  const container = document.getElementById('mindmapSvg');
  if (!container) return;

  const w = container.clientWidth || 360;
  const h = 260;
  const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
  svg.setAttribute('width','100%'); svg.setAttribute('height', h);

  // Root node
  const rootX = 20, rootY = h/2 - 16, rootW = 105, rootH = 32;
  const g1 = document.createElementNS('http://www.w3.org/2000/svg','g');
  const r1 = document.createElementNS('http://www.w3.org/2000/svg','rect');
  r1.setAttribute('x',rootX); r1.setAttribute('y',rootY); r1.setAttribute('width',rootW); r1.setAttribute('height',rootH);
  r1.setAttribute('rx','6'); r1.setAttribute('fill','#EEF2FF'); r1.setAttribute('stroke','#4F46E5'); r1.setAttribute('stroke-width','2');
  g1.appendChild(r1);
  const t1 = document.createElementNS('http://www.w3.org/2000/svg','text');
  t1.setAttribute('x',rootX+rootW/2); t1.setAttribute('y',rootY+rootH/2+5); t1.setAttribute('text-anchor','middle');
  t1.setAttribute('fill','#4F46E5'); t1.setAttribute('font-size','12'); t1.setAttribute('font-weight','600');
  t1.setAttribute('font-family','system-ui,sans-serif'); t1.textContent = stageName + ' Agent';
  g1.appendChild(t1);
  svg.appendChild(g1);

  // Child nodes
  const children = getAgentSteps(stageName);
  const n = children.length;
  const spacing = h / (n + 1);
  const startX = rootX + rootW + 35;
  const nodeW = 80, nodeH = 26;

  children.forEach((child, i) => {
    const cy = spacing * (i + 1) - nodeH/2;
    // Curved line
    const path = document.createElementNS('http://www.w3.org/2000/svg','path');
    const sx = rootX + rootW, sy = rootY + rootH/2;
    const ex = startX, ey = cy + nodeH/2;
    path.setAttribute('d', `M${sx},${sy} C${sx+20},${sy} ${ex-20},${ey} ${ex},${ey}`);
    path.setAttribute('fill','none'); path.setAttribute('stroke', child.color || '#CBD5E1'); path.setAttribute('stroke-width','1.5');
    svg.appendChild(path);

    const g = document.createElementNS('http://www.w3.org/2000/svg','g');
    g.setAttribute('class','mindmap-clickable'); g.style.cursor = 'pointer';
    const r = document.createElementNS('http://www.w3.org/2000/svg','rect');
    r.setAttribute('x',startX); r.setAttribute('y',cy); r.setAttribute('width',nodeW); r.setAttribute('height',nodeH);
    r.setAttribute('rx','5'); r.setAttribute('fill',child.fill || '#F1F5F9');
    r.setAttribute('stroke',child.stroke || '#CBD5E1'); r.setAttribute('stroke-width','1');
    g.appendChild(r);
    const t = document.createElementNS('http://www.w3.org/2000/svg','text');
    t.setAttribute('x',startX+nodeW/2); t.setAttribute('y',cy+nodeH/2+4);
    t.setAttribute('text-anchor','middle'); t.setAttribute('fill',child.color || '#475569');
    t.setAttribute('font-size','10'); t.setAttribute('font-weight','500');
    t.setAttribute('font-family','system-ui,sans-serif'); t.textContent = child.text;
    g.appendChild(t);
    svg.appendChild(g);

    // Second level if any
    if (child.children) {
      child.children.forEach((c2, j) => {
        const c2x = startX + nodeW + 20;
        const c2y = cy + (j - (child.children.length-1)/2) * 28;
        const p2 = document.createElementNS('http://www.w3.org/2000/svg','path');
        const c2sx = startX + nodeW, c2sy = cy + nodeH/2;
        p2.setAttribute('d', `M${c2sx},${c2sy} C${c2sx+12},${c2sy} ${c2x-12},${c2y+nodeH/2} ${c2x},${c2y+nodeH/2}`);
        p2.setAttribute('fill','none'); p2.setAttribute('stroke',c2.color||'#CBD5E1'); p2.setAttribute('stroke-width','1');
        svg.appendChild(p2);
        const g2 = document.createElementNS('http://www.w3.org/2000/svg','g');
        const r2 = document.createElementNS('http://www.w3.org/2000/svg','rect');
        r2.setAttribute('x',c2x); r2.setAttribute('y',c2y); r2.setAttribute('width',72); r2.setAttribute('height',nodeH);
        r2.setAttribute('rx','4'); r2.setAttribute('fill',c2.fill||'#F8FAFC');
        r2.setAttribute('stroke',c2.color||'#E2E8F0'); r2.setAttribute('stroke-width','1');
        g2.appendChild(r2);
        const t2 = document.createElementNS('http://www.w3.org/2000/svg','text');
        t2.setAttribute('x',c2x+36); t2.setAttribute('y',c2y+nodeH/2+4);
        t2.setAttribute('text-anchor','middle'); t2.setAttribute('fill','#475569');
        t2.setAttribute('font-size','9'); t2.setAttribute('font-family','system-ui,sans-serif');
        t2.textContent = c2.text;
        g2.appendChild(t2);
        svg.appendChild(g2);
      });
    }
  });

  container.innerHTML = '';
  container.appendChild(svg);
}

function renderChat(task) {
  const msgs = document.getElementById('chatMessages');
  if (!msgs) return;
  const stageIdx = task.stageCurrent;
  const key = task.id + '-' + stageIdx;
  const conv = state.conversations[key] || [];
  msgs.innerHTML = conv.map(m => `
    <div class="chat-msg ${m.role}">
      <div class="avatar-sm ${m.role==='agent'?'agent':'human'}">${m.role==='agent'?'AI':'张'}</div>
      <div><div class="chat-bubble">${m.text}</div><div class="chat-meta">${m.role==='agent'?'Agent':'我'} · ${m.time}</div></div>
    </div>`).join('');
  // Scroll to bottom
  msgs.scrollTop = msgs.scrollHeight;
}

function sendMessage() {
  const input = document.getElementById('chatInput');
  if (!input) return;
  const text = input.value.trim();
  if (!text) return;
  const task = getTask(state.activeTaskId);
  if (!task) return;
  const stageIdx = task.stageCurrent;
  const key = task.id + '-' + stageIdx;
  if (!state.conversations[key]) state.conversations[key] = [];
  state.conversations[key].push({ role:'user', text, time:m(0) });
  input.value = '';
  renderChat(task);
  // Simulate AI response
  const msgs = document.getElementById('chatMessages');
  if (chatTimeout) clearTimeout(chatTimeout);
  // Show typing indicator
  const typingEl = document.createElement('div');
  typingEl.className = 'chat-msg agent';
  typingEl.innerHTML = `<div class="avatar-sm agent">AI</div><div><div class="chat-bubble" style="color:var(--text-muted);">正在思考...</div></div>`;
  msgs.appendChild(typingEl);
  msgs.scrollTop = msgs.scrollHeight;
  chatTimeout = setTimeout(() => {
    typingEl.remove();
    const responses = [
      '好的，我来根据你的意见进行修改。已更新相关代码，并触发了增量门禁检查。',
      '理解你的需求。我已经调整了实现方案，现在的逻辑更清晰了。需要我再详细解释修改内容吗？',
      '已按照你的建议完成修改。产出物已更新，Harness 规则正在重新检查中...',
      '这个建议很好。我已经优化了这部分代码，现在性能应该会有明显改善。',
      '收到。我修改了对应的文件，保持了与其他模块的一致性。你可以预览最新的产出物。',
    ];
    const respText = responses[Math.floor(Math.random() * responses.length)];
    state.conversations[key].push({ role:'agent', text:respText, time:m(0) });
    renderChat(task);
    // Auto-fix a random gate
    if (task.stageGates[stageIdx]) {
      const failIdx = task.stageGates[stageIdx].findIndex(g => g === 0);
      if (failIdx >= 0) {
        setTimeout(() => {
          task.stageGates[stageIdx][failIdx] = 1;
          toast('增量门禁检查通过');
          renderTabContent(task, 'gates');
          renderPipelineGraph(task, {});
        }, 1500);
      }
    }
  }, 1500);
}

function openChatForFix() {
  const input = document.getElementById('chatInput');
  if (input) {
    input.value = '请帮我修复门禁失败的问题';
    sendMessage();
    input.focus();
  }
}

function autoFixGates(tid, stageIdx) {
  const task = getTask(tid);
  if (!task || !task.stageGates[stageIdx]) return;
  const stageName = task.stageNames[stageIdx];
  const agent = stageAgents[stageName] || { name: '未知 Agent', avatar: '🤖' };
  toast('Agent 正在自动修复门禁问题...');
  addActivityLog(tid, 'agent-work', agent.avatar, 'agent', `<strong>${agent.name}</strong> 开始自动修复「${stageName}」门禁问题`);
  const btn = document.querySelector('#stageDetailPanel .fix-gate-btn');
  if (btn) { btn.disabled = true; btn.textContent = '修复中...'; }

  // Simulate progress
  const progressInterval = setInterval(() => {
    // Fix gates one by one
    let allFixed = true;
    const gateDefs = state.gateDefs[stageName] || [];
    for (let i = 0; i < task.stageGates[stageIdx].length; i++) {
      if (task.stageGates[stageIdx][i] === 0) {
        if (Math.random() > 0.4) {
          task.stageGates[stageIdx][i] = 1;
          addActivityLog(tid, 'gate-check', '✓', 'gate', `门禁「${gateDefs[i]?.name || '检查'}」修复后 <strong>通过</strong>`);
        } else {
          allFixed = false;
        }
      }
    }
    renderTabContent(task, 'gates');
    renderPipelineGraph(task, {});
    if (allFixed) {
      clearInterval(progressInterval);
      if (btn) { btn.disabled = false; btn.textContent = '已修复'; btn.className = 'btn btn-success btn-sm fix-gate-btn'; }
      toast('全部门禁修复完成！');
      addActivityLog(tid, 'agent-work', '✓', 'agent', `<strong>${agent.name}</strong> 完成「${stageName}」门禁修复，全部通过`);
      state.timeline.unshift({ time: m(0), text: `Agent 自动修复了 <strong>${task.title}</strong> 的 ${stageName} 阶段门禁问题` });
    }
  }, 800);
}

function advanceStage(task) {
  if (task.stageCurrent >= task.stageNames.length - 1) {
    toast('已是最后一个阶段', true); return;
  }
  if (task.stageCurrent >= 0 && task.stageGates[task.stageCurrent] && task.stageGates[task.stageCurrent].some(g => g === 0)) {
    showGateBlockedDialog(task);
    return;
  }

  const prevStageName = task.stageCurrent >= 0 ? task.stageNames[task.stageCurrent] : null;
  const prevAgent = prevStageName ? stageAgents[prevStageName] : null;

  if (task.stageCurrent >= 0) {
    task.stages[task.stageCurrent] = 2;
    // Log agent completion
    if (prevAgent) {
      addActivityLog(task.id, 'agent-work', '✓', 'agent', `<strong>${prevAgent.name}</strong> 完成「${prevStageName}」阶段`);
    }
  }
  task.stageCurrent++;
  task.stages[task.stageCurrent] = 0;

  const stageName = task.stageNames[task.stageCurrent];
  const agent = stageAgents[stageName] || { name: '未知 Agent', avatar: '🤖' };
  const gateDefs = state.gateDefs[stageName] || [];
  if (!task.stageGates[task.stageCurrent] || task.stageGates[task.stageCurrent].length === 0) {
    task.stageGates[task.stageCurrent] = gateDefs.map(() => 0);
  }
  const newGates = gateDefs.map((g, i) => {
    if (g.type === 'fail' && Math.random() > 0.5) return 0;
    return 1;
  });
  if (stageName === '代码审查') newGates[2] = 0;
  if (stageName === '单元测试') newGates[0] = 0;
  task.stageGates[task.stageCurrent] = newGates;

  // Log agent-to-agent communication
  if (prevAgent) {
    const commKey = `${prevStageName}→${stageName}`;
    addActivityLog(task.id, 'agent-comm', '→', 'agent', `<strong>${prevAgent.name}</strong> → <strong>${agent.name}</strong>: ${agentCommMessages[commKey] || '传递产出物'}`);
  }
  // Log new agent starting
  addActivityLog(task.id, 'agent-work', agent.avatar, 'agent', `<strong>${agent.name}</strong> 开始执行「${stageName}」阶段`);

  // Log gate results
  newGates.forEach((g, i) => {
    const gateName = gateDefs[i]?.name || '检查';
    if (g === 1) {
      addActivityLog(task.id, 'gate-check', '✓', 'gate', `门禁「${gateName}」<strong>通过</strong>`);
    } else {
      addActivityLog(task.id, 'gate-fail', '✗', 'fail', `门禁「${gateName}」<strong>阻断</strong> — ${gateDefs[i]?.desc || ''}`);
    }
  });

  if (['方案设计','代码审查'].includes(stageName) && !state.reviews.find(r => r.tid === task.id && r.stage === task.stageCurrent)) {
    const reviewers = ['王工','李工','赵工','刘工'];
    const rv = { id:'r'+(reviewIdCounter++), tid:task.id, stage:task.stageCurrent, stageName, reviewer:reviewers[Math.floor(Math.random()*reviewers.length)], status:'pending', desc:`${stageName}阶段产出物需要人工评审确认` };
    state.reviews.push(rv);
    addActivityLog(task.id, 'human-action', '👤', 'human', `<strong>${rv.reviewer}</strong> 被分配为「${stageName}」评审人`);
    toast(`已自动创建 ${stageName} 评审任务，评审人: ${rv.reviewer}`);
  }

  state.timeline.unshift({ time: m(0), text: `任务 <strong>${task.title}</strong> 进入 <strong>${stageName}</strong> 阶段` });

  const project = getProject(task.pid);
  if (project && task.stageCurrent > project.stagesDone) project.stagesDone = task.stageCurrent;

  toast(`已进入 "${stageName}" 阶段`);

  if (task._animTimer) clearTimeout(task._animTimer);
  task._animRunning = true;
  task._animStageIdx = task.stageCurrent;

  const container = document.getElementById('mainContent');
  renderPipeline(container, { tid: task.id });
  updateBadges();

  function runAnim() {
    if (!task._animRunning || task.stageCurrent >= task.stageNames.length - 1) {
      task._animRunning = false;
      return;
    }
    const idx = task._animStageIdx;
    if (task.stages[idx] === 0) {
      const animStageName = task.stageNames[idx];
      const animAgent = stageAgents[animStageName] || { name: '未知 Agent', avatar: '🤖' };
      task.stages[idx] = 2;
      addActivityLog(task.id, 'agent-work', '✓', 'agent', `<strong>${animAgent.name}</strong> 完成「${animStageName}」阶段`);
      task._animStageIdx++;
      renderPipelineGraph(task, {});
      if (task._animStageIdx < task.stageNames.length) {
        const nextName = task.stageNames[task._animStageIdx];
        const nextAgent = stageAgents[nextName] || { name: '未知 Agent' };
        const commKey = `${animStageName}→${nextName}`;
        addActivityLog(task.id, 'agent-comm', '→', 'agent', `<strong>${animAgent.name}</strong> → <strong>${nextAgent.name}</strong>: ${agentCommMessages[commKey] || '传递产出物'}`);
        task._animTimer = setTimeout(runAnim, 2000);
      } else {
        task._animRunning = false;
      }
    }
  }

  task._animTimer = setTimeout(runAnim, 2000);
}

function showGateBlockedDialog(task) {
  const stageName = task.stageNames[task.stageCurrent];
  const agent = stageAgents[stageName] || { name: '未知 Agent', avatar: '🤖' };
  const gateDefs = state.gateDefs[stageName] || [];
  const failedGates = task.stageGates[task.stageCurrent]
    .map((g, i) => g === 0 ? gateDefs[i] : null)
    .filter(Boolean);

  // Find the code generation stage index for rollback
  const codeGenIdx = task.stageNames.indexOf('代码生成');
  const canRollback = codeGenIdx >= 0 && task.stageCurrent > codeGenIdx;

  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal" style="width:520px;">
      <h3 style="display:flex;align-items:center;gap:10px;">
        <span style="font-size:24px;">&#9888;</span>
        门禁阻断 — ${stageName}
      </h3>
      <div style="margin-bottom:16px;">
        <div style="font-size:13px;color:var(--text-secondary);margin-bottom:12px;">
          <strong>${agent.name}</strong> 在「${stageName}」阶段遇到门禁阻断，无法继续推进：
        </div>
        ${failedGates.map(g => `
          <div style="display:flex;align-items:flex-start;gap:10px;padding:10px 12px;background:var(--danger-light);border-radius:var(--radius-sm);margin-bottom:8px;border-left:3px solid var(--danger);">
            <span style="color:var(--danger);font-weight:700;">&#10007;</span>
            <div>
              <div style="font-size:13px;font-weight:600;">${g.name}</div>
              <div style="font-size:12px;color:var(--text-muted);margin-top:2px;">${g.desc}</div>
              ${g.detail ? `<div style="font-size:11px;color:var(--danger);margin-top:4px;font-family:var(--mono);">${g.detail}</div>` : ''}
            </div>
          </div>
        `).join('')}
      </div>
      <div style="margin-bottom:16px;padding:14px;background:#F8FAFC;border-radius:var(--radius);border:1px solid var(--border);">
        <div style="font-size:13px;font-weight:600;margin-bottom:8px;">&#9730; AI 建议</div>
        <div style="font-size:12px;color:var(--text-secondary);line-height:1.6;">
          ${stageName === '代码审查' ? '代码复杂度超标，建议回退到代码生成阶段，由代码生成 Agent 自动重构相关代码后重新审查。' :
            stageName === '单元测试' ? '测试覆盖率不足，建议回退到代码生成阶段，由代码生成 Agent 补充代码后重新生成测试。' :
            '建议回退到代码生成阶段，由 Agent 修复问题后重新执行后续流程。'}
        </div>
      </div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;">
        ${canRollback ? `
          <button class="btn btn-primary" onclick="agentRollbackToCodeGen('${task.id}')" style="flex:1;min-width:180px;">
            &#9730; 让 Agent 修复（回退到代码生成）
          </button>
        ` : ''}
        <button class="btn btn-success" onclick="skipGateAndAdvance('${task.id}')" style="flex:1;min-width:140px;">
          &#9654; 手动跳过门禁
        </button>
        <button class="btn btn-outline" onclick="this.closest('.modal-overlay').remove()" style="flex:1;min-width:80px;">
          取消
        </button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  // Click outside to close
  overlay.addEventListener('click', (e) => {
    if (e.target === overlay) overlay.remove();
  });
}

function agentRollbackToCodeGen(taskId) {
  const task = getTask(taskId);
  if (!task) return;

  const currentStage = task.stageNames[task.stageCurrent];
  const codeGenIdx = task.stageNames.indexOf('代码生成');
  if (codeGenIdx < 0) { toast('未找到代码生成阶段', true); return; }

  const codeGenAgent = stageAgents['代码生成'] || { name: '代码生成 Agent', avatar: '💻' };
  const currentAgent = stageAgents[currentStage] || { name: '未知 Agent', avatar: '🤖' };

  // Close modal
  document.querySelector('.modal-overlay')?.remove();

  // Log the rollback decision
  addActivityLog(taskId, 'agent-comm', '↩', 'agent', `<strong>${currentAgent.name}</strong> → <strong>${codeGenAgent.name}</strong>: 门禁阻断，请求回退修复`);
  addActivityLog(taskId, 'human-action', '👤', 'human', `审批通过：回退到「代码生成」阶段进行修复`);

  // Reset stages from codeGenIdx+1 to current
  for (let i = codeGenIdx + 1; i <= task.stageCurrent; i++) {
    task.stages[i] = 0;
    if (task.stageGates[i]) {
      task.stageGates[i] = task.stageGates[i].map(() => 0);
    }
  }

  // Set current to code generation
  task.stageCurrent = codeGenIdx;
  task.stages[codeGenIdx] = 0; // Mark as in-progress

  // Reset code gen gates to all pass (simulating agent fixing)
  const codeGenGates = state.gateDefs['代码生成'] || [];
  task.stageGates[codeGenIdx] = codeGenGates.map(() => 1);

  // Start the repair animation
  toast('Agent 开始回退修复...');
  addActivityLog(taskId, 'agent-work', codeGenAgent.avatar, 'agent', `<strong>${codeGenAgent.name}</strong> 开始修复代码，解决门禁阻断问题`);

  const container = document.getElementById('mainContent');
  renderPipeline(container, { tid: taskId });
  updateBadges();

  // Simulate agent repair process
  setTimeout(() => {
    task.stages[codeGenIdx] = 2; // Mark code gen as done
    addActivityLog(taskId, 'agent-work', '✓', 'agent', `<strong>${codeGenAgent.name}</strong> 完成代码修复`);

    // Re-advance through subsequent stages
    const stagesToRedo = [];
    for (let i = codeGenIdx + 1; i <= task.stageNames.length - 1; i++) {
      stagesToRedo.push(i);
    }

    let delay = 0;
    stagesToRedo.forEach((stageIdx, seq) => {
      delay += 1200;
      setTimeout(() => {
        const sName = task.stageNames[stageIdx];
        const sAgent = stageAgents[sName] || { name: '未知 Agent', avatar: '🤖' };
        const prevName = stageIdx > 0 ? task.stageNames[stageIdx - 1] : null;
        const prevAgent = prevName ? stageAgents[prevName] : null;

        // Mark previous as done
        if (stageIdx > 0) task.stages[stageIdx - 1] = 2;
        task.stageCurrent = stageIdx;
        task.stages[stageIdx] = 0;

        // Generate gates with better odds (agent fixed the issues)
        const gateDefs = state.gateDefs[sName] || [];
        const newGates = gateDefs.map((g, i) => {
          // Code review complexity check now passes after fix
          if (sName === '代码审查' && g.name === '代码复杂度检查') return 1;
          // Unit test coverage now passes after fix
          if (sName === '单元测试' && g.name === '覆盖率门禁') return 1;
          if (g.type === 'fail' && Math.random() > 0.7) return 0;
          return 1;
        });
        task.stageGates[stageIdx] = newGates;

        // Log communication
        if (prevAgent) {
          const commKey = `${prevName}→${sName}`;
          addActivityLog(taskId, 'agent-comm', '→', 'agent', `<strong>${prevAgent.name}</strong> → <strong>${sAgent.name}</strong>: ${agentCommMessages[commKey] || '传递产出物'}`);
        }
        addActivityLog(taskId, 'agent-work', sAgent.avatar, 'agent', `<strong>${sAgent.name}</strong> 开始执行「${sName}」阶段`);

        // Log gate results
        newGates.forEach((g, i) => {
          const gateName = gateDefs[i]?.name || '检查';
          if (g === 1) {
            addActivityLog(taskId, 'gate-check', '✓', 'gate', `门禁「${gateName}」<strong>通过</strong>`);
          } else {
            addActivityLog(taskId, 'gate-fail', '✗', 'fail', `门禁「${gateName}」<strong>阻断</strong>`);
          }
        });

        renderPipelineGraph(task, {});

        // If last stage, mark as done
        if (stageIdx === task.stageNames.length - 1) {
          setTimeout(() => {
            task.stages[stageIdx] = 2;
            addActivityLog(taskId, 'agent-work', '✓', 'agent', `<strong>${sAgent.name}</strong> 完成「${sName}」阶段`);
            addActivityLog(taskId, 'agent-work', '✅', 'agent', `全部阶段修复完成，流水线已恢复`);
            renderPipelineGraph(task, {});
            toast('Agent 修复完成，流水线已恢复！');
            state.timeline.unshift({ time: m(0), text: `Agent 修复了 <strong>${task.title}</strong> 的门禁问题，流水线已恢复` });
          }, 1200);
        }
      }, delay);
    });
  }, 2000);
}

function skipGateAndAdvance(taskId) {
  const task = getTask(taskId);
  if (!task) return;

  // Close modal
  document.querySelector('.modal-overlay')?.remove();

  const stageName = task.stageNames[task.stageCurrent];
  const agent = stageAgents[stageName] || { name: '未知 Agent' };

  // Force pass all gates
  if (task.stageGates[task.stageCurrent]) {
    task.stageGates[task.stageCurrent] = task.stageGates[task.stageCurrent].map(() => 1);
  }

  addActivityLog(taskId, 'human-action', '👤', 'human', `手动跳过「${stageName}」阶段门禁`);
  toast('已手动跳过门禁');

  // Now advance
  renderPipelineGraph(task, {});
  advanceStage(task);
}

function submitReview(rid, decision) {
  const review = state.reviews.find(r => r.id === rid);
  if (!review) return;
  review.status = decision === 'approved' ? 'approved' : (decision === 'changes' ? 'changes_requested' : 'rejected');
  const decisionLabel = decision === 'approved' ? '通过' : (decision === 'changes' ? '需修改' : '驳回');
  toast(`评审已${decisionLabel}`);

  // Log human action
  addActivityLog(review.tid, 'human-action', '👤', 'human', `<strong>${review.reviewer}</strong> 对「${review.stageName}」评审: <strong>${decisionLabel}</strong>`);

  // If approved, check if all reviews for this task are approved
  if (decision === 'approved') {
    const task = getTask(review.tid);
    if (task) {
      // Check if there are any remaining pending reviews for this task
      const pendingReviews = state.reviews.filter(r => r.tid === task.id && r.status === 'pending');
      const hasRejected = state.reviews.some(r => r.tid === task.id && r.status === 'rejected');

      if (pendingReviews.length === 0 && !hasRejected) {
        // All reviews passed - auto advance
        addActivityLog(task.id, 'agent-comm', '✓', 'agent', `全部评审通过，流水线自动推进`);
        state.timeline.unshift({ time: m(0), text: `<strong>${task.title}</strong> 的全部评审已通过，流水线自动推进` });

        // Check if gates are all passed before advancing
        const gatesOk = !task.stageGates[task.stageCurrent] || !task.stageGates[task.stageCurrent].some(g => g === 0);
        if (gatesOk) {
          setTimeout(() => {
            toast('全部评审通过，自动推进到下一阶段');
            advanceStage(task);
          }, 800);
        } else {
          toast('评审已通过，但当前阶段门禁未通过，需先修复门禁');
        }
      } else if (pendingReviews.length > 0) {
        toast(`还有 ${pendingReviews.length} 项评审待完成`);
      }
    }
  }

  state.timeline.unshift({ time: m(0), text: `${review.reviewer} ${decisionLabel}了 <strong>${getTask(review.tid)?.title||''}</strong> 的 ${review.stageName} 评审` });
  const container = document.getElementById('mainContent');
  if (state.activePage === 'pipeline-view') {
    const task = getTask(state.activeTaskId);
    if (task) renderPipeline(container, { tid: task.id });
  } else if (state.activePage === 'reviews') {
    renderReviews(container);
  }
  updateBadges();
}

function submitReviewWithComment(rid) {
  const comment = document.getElementById('reviewComment')?.value?.trim();
  if (comment) {
    state.timeline.unshift({ time: m(0), text: `评审意见: ${comment}` });
  }
  submitReview(rid, comment ? 'changes' : 'approved');
}

function requestReview() {
  const task = getTask(state.activeTaskId);
  if (!task) return;
  const stageName = task.stageNames[task.stageCurrent] || '未知';
  const rv = { id:'r'+(reviewIdCounter++), tid:task.id, stage:task.stageCurrent, stageName, reviewer:'王工', status:'pending', desc:'手动请求人工评审' };
  state.reviews.push(rv);
  addActivityLog(task.id, 'human-action', '👤', 'human', `<strong>${rv.reviewer}</strong> 被分配为「${stageName}」评审人（手动请求）`);
  toast(`已请求 ${rv.reviewer} 进行评审`);
  updateBadges();
  const container = document.getElementById('mainContent');
  renderPipeline(container, { tid: task.id });
}

function renderGates(container) {
  const project = getProject(state.activeProjectId);
  const tasks = getProjectTasks(state.activeProjectId).filter(t => t.stageNames.length > 0);
  let rows = '';
  tasks.forEach(task => {
    task.stageNames.forEach((name, i) => {
      const gates = task.stageGates[i] || [];
      const defs = state.gateDefs[name] || [];
      defs.forEach((g, j) => {
        const status = gates[j] === 1 ? 'pass' : (gates[j] === 0 && task.stageCurrent === i ? 'fail' : 'pending');
        if (status === 'pending' && i > task.stageCurrent) return; // future stages not shown
        rows += `<tr>
          <td>${task.title}</td><td>${name}</td><td>${g.name}</td>
          <td><span class="tag ${status==='pass'?'tag-green':status==='fail'?'tag-red':'tag-slate'}">${status==='pass'?'通过':status==='fail'?'阻断':'待执行'}</span></td>
          <td style="color:var(--text-muted);font-size:12px;">${status==='pending'?'—':Math.floor(Math.random()*10+1)+'分钟前'}</td>
          <td>${status==='fail'?g.detail||'检测未通过':'—'}</td>
        </tr>`;
      });
    });
  });
  container.innerHTML = `
    <div style="font-size:22px;font-weight:700;">门禁管理</div>
    <div class="card">
      <div class="card-header"><div><div class="card-title">${project.name} · 全阶段门禁概览</div><div class="card-subtitle">${tasks.length} 个任务 · 最后检查: 3 分钟前</div></div><button class="btn btn-primary btn-sm" onclick="refreshAllGates()">&#8635; 全部重新检查</button></div>
      <table><thead><tr><th>任务</th><th>阶段</th><th>规则名称</th><th>状态</th><th>检测时间</th><th>详情</th></tr></thead><tbody>${rows||'<tr><td colspan="6" style="text-align:center;color:var(--text-muted);padding:30px;">暂无门禁数据</td></tr>'}</tbody></table>
    </div>`;
}

function refreshAllGates() {
  toast('正在重新执行全部门禁规则...');
  setTimeout(() => {
    getProjectTasks(state.activeProjectId).forEach(task => {
      task.stageGates.forEach((gates, i) => {
        if (i <= task.stageCurrent && gates) {
          for (let j = 0; j < gates.length; j++) {
            if (gates[j] === 0 && Math.random() > 0.3) gates[j] = 1;
          }
        }
      });
    });
    toast('门禁检查完成');
    if (state.activePage === 'gates') renderGates(document.getElementById('mainContent'));
    updateBadges();
  }, 1200);
}

function renderReviews(container) {
  const pending = state.reviews.filter(r => r.status === 'pending');
  const done = state.reviews.filter(r => r.status !== 'pending');
  container.innerHTML = `
    <div style="font-size:22px;font-weight:700;">评审中心</div>
    <div class="grid-2">
      <div class="card"><div class="card-title" style="margin-bottom:14px;">待我评审 (${pending.length})</div>
        ${pending.length === 0 ? '<div class="empty-state"><div>暂无待评审项</div></div>' : pending.map(r => `
          <div class="review-card">
            <div class="review-header"><div class="reviewer"><span class="status-dot amber"></span> ${getTask(r.tid)?.title||'未知任务'} · ${r.stageName}</div><span class="tag tag-amber">待评审</span></div>
            <div style="font-size:12px;color:var(--text-muted);">评审人: ${r.reviewer}</div><div style="font-size:12px;margin-top:6px;">${r.desc}</div>
            <div style="margin-top:10px;display:flex;gap:8px;">
              <button class="btn btn-primary btn-xs" onclick="selectProject('${getTask(r.tid)?.pid}');navigate('pipeline-view',{tid:'${r.tid}'});">查看详情</button>
              <button class="btn btn-success btn-xs" onclick="submitReview('${r.id}','approved')">&#10003; 快速通过</button>
            </div>
          </div>`).join('')}
      </div>
      <div class="card"><div class="card-title" style="margin-bottom:14px;">已完成评审 (${done.length})</div>
        ${done.length === 0 ? '<div class="empty-state"><div>暂无完成记录</div></div>' : done.map(r => `
          <div class="review-card">
            <div class="review-header"><div class="reviewer"><span class="status-dot green"></span> ${getTask(r.tid)?.title||'未知'} · ${r.stageName}</div><span class="tag ${r.status==='approved'?'tag-green':r.status==='changes_requested'?'tag-amber':'tag-red'}">${r.status==='approved'?'已通过':r.status==='changes_requested'?'需修改':'已驳回'}</span></div>
            <div style="font-size:12px;color:var(--text-muted);">评审人: ${r.reviewer}</div>
          </div>`).join('')}
      </div>
    </div>`;
}

// ============================================================
// RULES CONFIG
// ============================================================
function renderRulesConfig(container) {
  const project = getProject(state.activeProjectId);
  const categories = [
    { title:'需求阶段规则', keys:['需求完整性检查','语义冲突检测','可追溯性检查'] },
    { title:'设计阶段规则', keys:['架构合规检查','技术选型评估'] },
    { title:'代码阶段规则', keys:['编码规范检查','安全漏洞扫描','代码复杂度检查','最佳实践检测'] },
    { title:'测试阶段规则', keys:['覆盖率门禁','测试通过率','技术债务检查'] },
    { title:'验收阶段规则', keys:['DoD检查清单','合规审计检查'] },
  ];
  container.innerHTML = `
    <div style="display:flex;align-items:center;justify-content:space-between;">
      <div><div style="font-size:22px;font-weight:700;">Harness 规则配置</div><div style="font-size:13px;color:var(--text-muted);margin-top:4px;">项目: ${project.name} · 规则集: ${project.rulesSet}</div></div>
      <button class="btn btn-outline btn-sm" onclick="resetRules()">&#9881; 恢复默认</button>
    </div>
    <div class="grid-2" id="rulesGrid"></div>`;
  renderRulesGrid(categories);
}

function renderRulesGrid(categories) {
  const grid = document.getElementById('rulesGrid');
  if (!grid) return;
  grid.innerHTML = categories.map(cat => `
    <div class="card">
      <div class="card-title" style="margin-bottom:14px;">${cat.title}</div>
      ${cat.keys.map(key => {
        const on = state.rulesConfig[key] !== false;
        return `<div class="rule-config-item">
          <div><div class="rule-name">${key}</div><div class="rule-desc">${getRuleDesc(key)}</div></div>
          <div class="toggle${on?' on':''}" onclick="toggleRule(this,'${key}')"></div>
        </div>`;
      }).join('')}
    </div>`).join('');
}

function getRuleDesc(key) {
  const map = {
    '需求完整性检查':'检查需求是否包含背景、目标、验收标准、非功能需求',
    '语义冲突检测':'检测需求之间的逻辑矛盾和术语不一致',
    '可追溯性检查':'验证需求到业务目标的可追溯链路',
    '架构合规检查':'检查方案是否符合架构规范，阈值可调',
    '技术选型评估':'评估技术选型的合理性和风险等级',
    '编码规范检查':'ESLint/Sonar 规范检查，阈值可调',
    '安全漏洞扫描':'OWASP Top 10 安全风险检测',
    '代码复杂度检查':'圈复杂度 ≤ 15 · 函数行数 ≤ 80',
    '最佳实践检测':'异常处理、资源释放、设计模式检查',
    '覆盖率门禁':'行覆盖率 ≥ 80% · 分支覆盖率 ≥ 70%',
    '测试通过率':'全部测试用例必须 100% 通过',
    '技术债务检查':'技术债务比率不超过 5%',
    'DoD检查清单':'功能完成、测试通过、文档齐全、性能达标',
    '合规审计检查':'数据安全、隐私合规、许可证合规',
  };
  return map[key] || '自定义规则';
}

function toggleRule(el, key) {
  const newVal = !el.classList.contains('on');
  if (newVal) el.classList.add('on'); else el.classList.remove('on');
  state.rulesConfig[key] = newVal;
  toast(`规则 "${key}" 已${newVal?'启用':'禁用'}`);
  // Propagate to active gates
  const task = getTask(state.activeTaskId);
  if (task && task.stageCurrent >= 0 && task.stageGates[task.stageCurrent]) {
    const stageName = task.stageNames[task.stageCurrent];
    const defs = state.gateDefs[stageName] || [];
    const idx = defs.findIndex(d => d.name === key);
    if (idx >= 0 && task.stageGates[task.stageCurrent][idx] !== undefined) {
      task.stageGates[task.stageCurrent][idx] = newVal ? 0 : 1; // re-check if enabled, auto-pass if disabled
      if (state.activePage === 'pipeline-view') {
        renderTabContent(task, 'gates');
      }
    }
  }
}

function resetRules() {
  Object.keys(state.rulesConfig).forEach(k => state.rulesConfig[k] = true);
  state.rulesConfig['合规审计检查'] = false;
  toast('规则配置已恢复默认');
  renderRulesGrid([
    { title:'需求阶段规则', keys:['需求完整性检查','语义冲突检测','可追溯性检查'] },
    { title:'设计阶段规则', keys:['架构合规检查','技术选型评估'] },
    { title:'代码阶段规则', keys:['编码规范检查','安全漏洞扫描','代码复杂度检查','最佳实践检测'] },
    { title:'测试阶段规则', keys:['覆盖率门禁','测试通过率','技术债务检查'] },
    { title:'验收阶段规则', keys:['DoD检查清单','合规审计检查'] },
  ]);
}

    { name:'代码审查技能', ver:'v2.8', calls:2104, status:'enabled', desc:'静态分析、安全扫描（OWASP）、复杂度检测、最佳实践审查。输出结构化审查报告和修复建议。', tags:['代码审查阶段','安全'] },
    { name:'测试生成技能', ver:'v1.9', calls:1856, status:'enabled', desc:'自动生成单元测试和集成测试用例，支持 JUnit / pytest / Jest。目标覆盖率可配置。', tags:['测试阶段','TDD'] },

    { name:'方案设计技能', ver:'v1.8', calls:892, status:'enabled', desc:'架构设计辅助、接口定义、技术选型建议。自动生成设计文档。', tags:['方案设计阶段'] },
    { name:'部署编排技能', ver:'v1.5', calls:412, status:'disabled', desc:'灰度发布策略生成、回滚条件校验、部署环境一致性检查。', tags:['部署阶段'] },
    { name:'验收检查技能', ver:'v1.6', calls:678, status:'enabled', desc:'DoD 检查清单自动化校验、合规审计辅助、性能验收。', tags:['验收阶段'] },

  container.innerHTML = `

      <span class="tag tag-blue">${skills.filter(s=>s.status==='enabled').length} 个技能可用</span>
    </div>
    <div class="grid-3">${skills.map(s => `
      <div class="card card-hover">
        <div class="card-header"><div><div class="card-title">&#9671; ${s.name}</div><div class="card-subtitle">${s.ver} · 调用 ${s.calls.toLocaleString()} 次</div></div><span class="tag ${s.status==='enabled'?'tag-green':'tag-slate'}">${s.status==='enabled'?'启用':'禁用'}</span></div>
        <div style="font-size:12px;color:var(--text-secondary);line-height:1.5;">${s.desc}</div>
        <div style="margin-top:10px;display:flex;gap:4px;flex-wrap:wrap;">${s.tags.map(t=>`<span class="tag tag-slate">${t}</span>`).join('')}</div>
        ${s.status==='enabled'?`<button class="btn btn-outline btn-sm" style="margin-top:10px;width:100%;" onclick="runSkillDemo('${s.name}')">&#9654; 演示调用</button>`:''}
      </div>`).join('')}</div>`;
}

function runSkillDemo(name) {
  toast(`技能 "${name}" 演示调用已触发`);
  const task = getTask(state.activeTaskId);
  if (!task || task.stageCurrent < 0) return;
  // Simulate skill execution
  setTimeout(() => {
    if (task.stageGates[task.stageCurrent]) {
      for (let i = 0; i < task.stageGates[task.stageCurrent].length; i++) {
        if (task.stageGates[task.stageCurrent][i] === 0 && Math.random() > 0.3) {
          task.stageGates[task.stageCurrent][i] = 1;
        }
      }
    }
    toast(`技能 "${name}" 执行完成`);
    if (state.activePage === 'pipeline-view') {
      const container = document.getElementById('mainContent');
      renderPipeline(container, { tid: task.id });
    }
    updateBadges();
  }, 1000);
}

// ============================================================
function init() {
  navigate('dashboard');
  // Keyboard shortcut: Ctrl+Enter in chat
  document.addEventListener('keydown', e => {
    if (e.ctrlKey && e.key === 'Enter') {
      const input = document.getElementById('chatInput');
      if (input === document.activeElement) sendMessage();
    }
  });
}

init();
</script>
