    function renderExecution(){const r=run(state.selectedRun),selected=r.stages.find(x=>x.id===r.selectedStage)||r.stages[0],agents=[...new Set(r.stages.map(x=>x.agent))];return `<div class="metrics"><div class="metric-card"><span>本地 Run</span><strong>${state.runs.length}</strong><p>失败 Run 保留，不被整改覆盖</p></div><div class="metric-card"><span>执行阶段</span><strong>${r.stages.length}</strong><p>阶段与 Agent 均可下钻</p></div><div class="metric-card"><span>Trace / Artifact</span><strong>${r.trace} / ${r.artifacts}</strong><p>当前 Run 的过程产物</p></div><div class="metric-card"><span>离线回滚验证</span><strong>${state.offlineValidated?"通过":"待执行"}</strong><p>交付硬门禁</p></div></div><div class="execution-layout"><section class="panel"><div class="panel-head"><div><h2>Harness Run</h2><p>按任务查看本地执行实例</p></div></div><div class="master-list">${state.runs.map(x=>`<button class="master-item ${x.id===state.selectedRun?"active":""}" data-action="select-run" data-id="${x.id}" ${x.id==="RUN-017-02"?`data-tour="failed-run"`:x.id==="RUN-017-03"?`data-tour="fix-run"`:""}><div class="meta-row">${badge(x.status,x.status==="已失败"?"red":"green")}<span class="mono">${x.context}</span></div><h3>${x.id}</h3><p>${task(x.task).title}</p><small>${x.result}</small></button>`).join("")}</div></section><section class="panel workflow-panel" data-tour="stage-monitor"><div class="panel-head"><div><h2>${r.id} 的阶段与 Agent</h2><p>Task：${r.task} ｜ commit ${r.commit} ｜ 本地环境：${r.environment}</p></div>${badge(r.status,r.status==="已失败"?"red":"green")}</div><p class="observability-note">可观测性视图：每个阶段都记录负责人 Agent、输入上下文、工具调用、产出 Artifact、Evidence 和下一阶段交接。</p><div class="agent-roster">${agents.map(agent=>{const first=r.stages.find(x=>x.agent===agent);return `<button class="agent-chip ${selected.agent===agent?"active":""}" data-action="select-agent" data-id="${agent}">${agent} ${badge(r.stages.filter(x=>x.agent===agent).length+" 阶段")}</button>`}).join("")}</div><div class="workflow-list">${r.stages.map((x,i)=>`<button class="workflow-stage ${x.id nt-feed" style="margin-top:8px">${DATA.events.map(x=>`<div class="event"><span class="mono">${x[0]}</span><span>${x[1]}</span>${badge(x[2])}</div>`).join("")}</div></div></div>`}
    function renderReview(){const d=dec(state.selectedDecision),e=ev(d.evidence);return `<div class="three-col"><section class="panel"><div class="panel-head"><div><h2>人工决策队列</h2><p>Agent 仅生成建议与候选产物</p></div>${badge(state.decisions.filter(x=>!x.status.startsWith("已")).length+" 项","red")}</div><div class="master-list">${state.decisions.map(x=>`<button class="master-item ${x.id===d.id?"active":""}" data-action="select-decision" data-id="${x.id}" ${x.id==="DEC-01"?`data-tour="decision"`:""}><div class="meta-row">${badge(x.type)}${badge(x.status,x.status==="已批准"?"green":x.status==="已退回"?"red":"amber")}</div><h3>${x.title}</h3><p>${x.role} · ${x.evidence}</p></button>`).join("")}</div></section><section class="panel" data-tour="evidence"><div class="panel-head"><div><h2>${d.title}</h2><p>${d.summary}</p></div>${badge(`风险 ${d.risk}`,d.risk==="高"?"red":"amber")}</div><div class="panel-body"><div class="chain"><div class="chain-node">${badge("Trace")}<strong>${e.trace}</strong><p>工具调用、命令、文件变化与测试输出。</p></div><div class="chain-node">${badge("Engineering Fact","green")}<strong>${e.fact}</strong><p>从真实工程系统提取的可核对状态。</p></div><div class="chain-node">${badge("Evidence","blue")}<strong>${e.id}</strong><p>${e.conclusion}，${e.valid}。</p></div><div class="chain-node">${badge("Review Decision","amber")}<strong>${d.status}</strong><p>必须由${d.role}形成正式结论。</p></div></div><div class="notice" style="margin-top:11px">Trace 不是 Evidence。Evidence 必须关联具体结论、对象版本、有效性、确认方式与失效条件。</div><div class="detail-section"><h3>整改闭环</h3><div class="status-list"><div class="status-row"><span>原问题与责任人<small>租户过滤遗漏 / 后端研发</small></span>${badge("RUN-017-02 已失败","red")}</div><div class="status-row"><span>整改与关闭依据<small>最小补丁 / EV-017-REG-04</small></span>${badge("RUN-017-03 已完成","green")}</div><div class="status-row"><span>范围与越界检查<small>仅修改授权模块，无任务外文件</small></span>${badge("通过","green")}</div></div></div><div class="action-row"><button class="btn danger small" data-action="decision-action" data-value="reject">模拟退回</butt     function renderDocuments(){const c=ch(state.selectedChapter);return `<div class="metrics"><div class="metric-card"><span>Document Package</span><strong>v3</strong><p>变更设计、接口、测试与部署说明</p></div><div class="metric-card"><span>受影响章节</span><strong>4</strong><p>其余 12 个章节受保护</p></div><div class="metric-card"><span>人工锁定</span><strong>1</strong><p>不会被 AI 静默覆盖</p></div><div class="metric-card"><span>审核状态</span><strong>${state.docsApproved?"已批准":"待审核"}</strong><p>关联 DEC-02</p></div></div><section class="panel" data-tour="doc-impact"><div class="panel-head"><div><h2>章节影响分析</h2><p>DOC-231-017-v3 ｜ 仅更新受影响章节</p></div>${badge(state.docsApproved?"已批准":"待审核",state.docsApproved?"green":"amber")}</div><div class="panel-body"><div class="chapter-grid">${state.chapters.map(x=>`<button class="chapter-card ${x.id===c.id?"active":""}" data-action="select-chapter" data-id="${x.id}">${badge(x.source,x.tone)} ${badge(x.status,x.status.includes("审核")||x.status.includes("确认")?"amber":x.status.includes("锁定")?"blue":"green")}<h3>${x.name}</h3><p>${x.impact}</p></button>`).join("")}</div><div class="two-col" style="margin-top:11px"><div><div class="detail-section"><h3>当前章节</h3><div class="info"><h3>${c.id}</h3><strong>${c.name}</strong><p>来源：${c.source} ｜ Evidence：${c.evidence}</p></div></div><div class="detail-section"><h3>追溯与一致性</h3><ul class="plain-list"><li>Requirement：REQ-231-017 R3</li><li>Task：TASK-1046</li><li>代码：commit a83c91e</li><li>Evidence：${c.evidence}</li><li>${c.locked?"人工锁定：只允许生成差异建议":"可审核：批准后进入共同 Baseline"}</li></ul></div></div><div><div class="detail-section"><h3>章节差异</h3><div class="diff"><div class="diff-box"><strong>批准版本</strong><br><span class="diff-del">GET /rules/{id} 不包含租户约束说明</span><br>返回 RuleDetail</div><div class="diff-box"><strong>建议增量</strong><br><span class="diff-add">+ 所有查询必须校验 tenant_id</span><br><span class="diff-add">+ 跨租户请求返回 403</span></div></div></div><div class="notice" style="margin-top:9px">发现代码与批准设计冲突时，系统只生成待决事项，不自动选择修改代码或文档。</div></div></div><div class="action-row" data-tour="doc-approve"><button class="btn danger small" data-action="doc-action" data-value="reject">模拟退回章节</button><button class="btn success small" data-action="doc-action" data-value="approve">批准 Document Package</button><button class="btn small" data-action="doc-action" data-value="invalidate">模拟契约变化并失效</button></div></div></section>`}

    function renderKnowledge(){const k=kn(state.selectedKnowledge),canPublish=state.patchApproved&&k.status==="待审核";return `<div class="two-col"><section class="panel"><div class="panel-head"><div><h2>Knowledge Entry</h2><p>候选、发布、替代与失效状态</p></div></div><div class="master-list">${state.knowledge.map(x=>`<button class="master-item ${x.id===k.id?"active":""}" data-action="select-knowledge" data-id="${x.id}" ${x.id==="KN-SEC-023"?`data-tour="knowledge-candidate"`:x.id==="KN-API-014"?`data-tour="knowledge-usage"`:""}><div class="meta-row">${badge(x.status,x.status==="已发布"?"green":x.status==="待审核"?"amber":x.status==="已失效"?"red":"purple")}<span class="mono">${x.id}</span></div><h3>${x.title}</h3><p>${x.scope}</p></button>`).join("")}</div></section><section class="panel"><div class="panel-head"><div><h2>${k.title}</h2><p>${k.id} ｜ ${k.scope}</p></div>${badge(k.status,k.status==="已发布"?"green":k.status==="待审核"?"amber":"red")}</div><div class="panel-body"><div class="info-grid"><div class="info"><h3>来源与 Evidence</h3><strong>${k.source}</strong><p>可回查原始 Review、Task 和 Run</p></div><div class="info"><h3>适用范围与风险</h3><strong>${k.scope}</strong><p>风险：${k.risk}</p></div><div class="info wide"><h3>建议规则</h3><strong>${k.rule}</strong><p>${k.effect}</p></div></div><div class="detail-section"><h3>Context Package 使用反馈</h3>${k.usage.length?k.usage.map(x=>`<div class="knowledge-usage"><span><strong>${x}</strong><br><small>已记录注入版本、使用 Task 和后续效果</small></span>${badge("使用中","green")}</div>`).join(""):`<div class="notice">当前没有 Context Package 使用此条目。未审核知识不会自动注入。</div>`}</div><div class="notice blue" style="margin-top:10px">正式责任人：知识管理员。Agent 只能提取候选和提供效果建议。</div><div class="action-row"><button class="btn danger small" data-action="knowledge-action" data-value="reject" ${k.status!=="待审核"?"disabled":""}>模拟退回</button><button class="btn success small" data-action="knowledge-action" data-value="publish" ${canPublish?"":"disabled"}>模拟发布</button><button class="btn small" data-action="knowledge-action" data-value="disable" ${k.status!=="已发布"?"disabled":""}>模拟停用</button></div>${k.status==="待审核"&&!state.patchApproved?`<p class="muted" style="font-size:9px">发布前置条件：技术负责人先在审查中心批准候选补丁。</p>`:""}</div></section></div>`}

    function runControl(v){const r=run(state.selectedRun);if(v==="pause")r.status="暂停";if(v==="resume")r.status=r.id==="RUN-017-02"?"已失败":"运行中";if(v==="upload"){uploadRunToServer(r);show(`${r.id}：Trace 与 Artifact 已完成服务端去重确认。`)}else show(`${r.id}：${r.status}。Task 状态未被自动改变。`);render()}

    function evidenceAction(v){if(v!=="confirm")return;const d=dec(state.selectedDecision),e=ev(d.evidence);if(!canRole(e.confirmer))return deny(e.confirmer);if(e.id==="EV-017-REG-04"&&!serverAcked("RUN-017-03")){show("服务端尚未确认整改 Run 的 Trace，不能确认 Evidence。");return}e.valid="有效";recordServerEvent("evidence-confirm",`${e.id} 已由 ${e.confirmer} 确认有效`,{evidenceId:e.id});show(`${e.id} 已确认有效，可以进入正式 Review Decision。`);render()}

    function drawerContent(t){if(state.tab==="overview")return `<div class="info-grid"><div class="info wide"><h3>Requirement</h3><strong>${DATA.project.req} ${DATA.project.reqVersion}</strong><p>${DATA.project.reqTitle}</p></div><div class="info"><h3>Task 状态</h3><strong>${t.status}</strong><p>业务与审查阶段</p></div><div class="info"><h3>风险与责任</h3><strong>${t.risk}风险 / ${t.owner}</strong><p>${t.gate}</p></div><div class="info wide"><h3>四场景协同</h3><p>${DATA.scenarios.map(x=>badge(x.name,x.tone)).join(" ")}</p></div></div>`;if(state.tab==="packages")return `<div data-tour="packages"><table><tr><th>Task Package</th><td><strong>${DATA.project.taskPackage}</strong><br>目标、边界、授权、验证、暂停条件与审查人</td></tr><tr><th>Context Package</th><td><strong>${currentContext()}</strong><br>Requirement R3、项目规范 v8、工具权限与 7 条验证命令</td></tr><tr><th>失效条件</th><td>公共契约、权限模型、数据结构或验收标准实质变化</td></tr></table><div class="notice blue" style="margin-top:10px">RUN-017-02 继续绑定 CTX v3，整改 RUN-017-03 使用 CTX v4；新知识发布会生成新 Context，不回写旧 Run。</div></div>`;if(state.tab==="runs")return `<div class="master-list">${state.runs.map(x=>`<button class="master-item" data-action="module" data-id="execution"><div class="meta-row">${badge(x.status,x.status==="已失败"?"red":"green")}<span>${x.id}</span></div><h3>${x.result}</h3><p>${x.context} / ${x.commit}</p></button>`).join("")}</div>`;if(state.tab==="evidence")return `<div class="chain">${['Trace','Engineering Fact','Evidence','Review Decision'].map((x,i)=>`<div class="chain-node"><strong>${x}</strong><p>${['发生了什么','可核对事实','支撑具体结论','人工正式决定'][i]}</p></div>`).join("")}</div><div class="notice" style="margin-top:10px">Trace 本身不是 Evidence，也不会自动成为知识。</div>`;if(state.tab==="review")return `<div class="status-list"><div class="status-row"><span>原问题<small>RUN-017-02 / 租户过滤遗漏</small></span>${badge("已归因","green")}</div><div class="status-row"><span>整改 Run<small>RUN-017-03 / EV-017-REG-04</small></span>${badge("待复审","amber")}</div></div><button class="btn primary" style="width:100%;margin-top:10px" data-action="module" data-id="review">进入审查中心</button>`;if(state.tab==="documents")return `<div class="info"><h3>Document Package</h3><strong>DOC-231-017-v3</strong><p>4 个受影响章节，12 个章节受保护，1 个章节人工锁定。</p></div><button class="btn primary" style="width:100%;margin-top:10px" data-action="module" data-id="documents">进入工程文档</button>`;return `<div class="info"><h3>候选 Baseline</h3><strong>${state.baselineVersion}</strong><p>${gates().filter(x=>!x.done).length} 项前置条件未完成。</p></div><button class="btn primary" style="width:100%;margin-top:10px" data-action="module" data-id="baseline">进入交付基线</button>`}
    function closeDrawer(){state.drawer=false;drawer.classList.remove("open");backdrop.classList.remove("open");drawer.setAttribute("aria-hidden","true")}

    function startTour(){state.tour=0;prepareTour()}
    function prepareTour(){const s=TOUR[state.tour];if(!s)return endTour();state.module=s.module;state.drawer=!!s.drawer;state.tab=s.tab||state.tab;if(s.run)state.selectedRun=s.run;if(s.decision)state.selectedDecision=s.decision;if(s.knowledge)state.selectedKnowledge=s.knowledge;if(s.agent)state.selectedServerAgent=s.agent;const p=new URLSearchParams(location.search);p.delete("variant");p.set("module",s.module);history.replaceState(null,"",`${location.pathname}?${p}`);render();setTimeout(applyFocus,30)}
    function renderTour(){if(state.tour<0){tourRoot.innerHTML="";return}const s=TOUR[state.tour];tourRoot.innerHTML=`<aside class="tour-card"><div class="tour-meta"><span>闭环演示 ${state.tour+1} / ${TOUR.length}</span><button class="btn small" data-tour-action="exit">退出</button></div><h2>${s.title}</h2><p>${s.text}</p><div class="tour-actions"><button class="btn small" data-tour-action="restart">重新开始</button><div><button class="btn small" data-tour-action="prev" ${state.tour===0?"disabled":""}>上一步</button><button class="btn primary small" data-tour-action="next">${state.tour===TOUR.length-1?"完成":"下一步"}</button></div></div></aside>`;tourRoot.querySelectorAll("[data-tour-action]").forEach(x=>x.addEventListener("click",tourAction))}
    function tourAction(e){const a=e.currentTarget.dataset.tourAction;if(a==="exit")return endTour();if(a==="restart")state.tour=0;if(a==="prev"&&state.tour>0)state.tour--;if(a==="next"){if(state.tour===TOUR.length-1)return endTour();state.tour++}prepareTour()}
    function applyFocus(){clearFocus();if(state.tour<0)return;const sel=TOUR[state.tour].target;let el=state.drawer?drawer.querySelector(sel):null;if(!el)el=app.querySelector(sel);if(!el)el=app.querySelector(".workspace-head");if(el){el.classList.add("tour-focus");el.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion:reduce)").matches?"auto":"smooth",block:"center",inline:"center"})}}
    function clearFocus(){document.querySelectorAll(".tour-focus").forEach(x=>x.classList.remove("tour-focus"))}function endTour(){state.tour=-1;clearFocus();tourRoot.innerHTML="";show("闭环引导演示已结束，可以继续自由探索。 ")}
    function show(msg){toast.textContent=msg;toast.classList.add("show");clearTimeout(show.timer);show.timer=setTimeout(()=>toast.classList.remove("show"),3200)}
    document.addEventListener("click",e=>{const b=e.target.closest?.('[data-action="decision-action"][data-value="risk"]');if(!b)return;const d=dec(state.selectedDecision);if(d.risk==="高"||d.type==="交付批准"){e.preventDefault();e.stopPropagation();show("风险接受被阻止：高风险变更和交付硬门禁必须完成正式审查，不能通过豁免绕过。")}},true);

    function stageLogs(s,r){return [{time:"14:02:11",source:"本地用户",tone:"client",title:"本地研发请求",text:`用户授权本阶段处理${r.task}，工作范围为${r.context}。`},{time:"14:02:13",source:"AI",tone:"ai",title:s.agent,text:`我已读取阶段输入和授权边界，将输出：${s.output}`},{time:"14:02:28",source:"工具",tone:"tool",title:(s.tools||"tool-run").split(" · ")[0],text:`执行${s.tools}，生成${s.artifact}，结果先写入本地 Run。`},{time:"14:03:02",source:"AI",tone:"ai",title:s.agent,text:s.finding||`阶段状态为“${s.status}”，产出已准备交接给${s.handoff}。`},{time:"14:03:08",source:"系统",tone:"system",title:"Run Orchestrator",text:`已记录${s.trace}条 Trace，关联 Artifact；${serverStatus(r)}，等待${s.handoff}接管。`}];}
    function focusStageLogs(){setTimeout(()=>document.getElementById("stage-logs")?.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion:reduce)").matches?"auto":"smooth",block:"start"}),30)}
    function renderExecution(){const r=run(state.selectedRun),selected=r.stages.find(x=>x.id===r.selectedStage)||r.stages[0],agents=[...new Set(r.stages.map(x=>x.agent))],logs=stageLogs(selected,r).filter(x=>state.logFilter==="all"||x.tone===state.logFilter);return `<div class="panel" style="margin-bottom:11px"><div class="panel-head"><div><h2>${r.id} 执行上下文</h2><p>Task：${r.task} ｜ ${task(r.task).title} ｜ ${r.context} ｜ commit ${r.commit}</p></div>${badge(r.status,r.status==="已失败"?"red":"green")}</div><div class="panel-body"><div class="status-list"><div class="status-row"><span>本地环境<small>${r.environment}</small></span>${badge("本地执行","blue")}</div><div class="status-row"><span>Trace 上报<small>本地：${r.upload} ｜ 服务端：${serverStatus(r)}</small></span>${badge(serverStatus(r),serverAcked(r.id)?"green":"amber")}</div><div class="status-row"><span>观测范围<small>阶段、Agent、客户端、AI、工具和 Artifact</small></span>${badge("可下钻","green")}</div></div></div></div><div class="execution-layout"><section class="panel"><div class="panel-head"><div><h2>Harness Run</h2><p>按任务选择本地执行实例</p></div></div><div class="master-list">${state.runs.map(x=>`<button class="master-item ${x.id===state.selectedRun?"active":""}" data-action="select-run" data-id="${x.id}" ${x.id==="RUN-017-02"?`data-tour="failed-run"`:x.id==="RUN-017-03"?`data-tour="fix-run"`:""}><div class="meta-row">${badge(x.status,x.status==="已失败"?"red":"green")}<span class="mono">${x.context}</span></div><h3>${x.id}</h3><p>${task(x.task).title}</p><small>${x.result}</small></button>`).join("")}</div></section><section class="panel workflow-panel" data-tour="stage-monitor"><div class="panel-head"><div><h2>阶段与 Agent</h2><p>当前 Run 共 ${r.stages.length} 个阶段，服务端：${serverStatus(r)}；点击阶段查看下方完整日志</p></div>${badge(`${agents.length} 个 Agent`,"blue")}</div><p class="observability-note">可观测性视图：阶段只保留关键状态，详细客户端与 AI 交互统一在下方日志面板查看，减少重复信息干扰。</p><div class="agent-roster">${agents.map(agent=>`<button class="agent-chip ${selected.agent===agent?"active":""}" data-acti class="action-row" style="padding:0 12px 12px"><button class="btn small" data-action="module" data-id="tasks">查看关联 Task</button><button class="btn small" data-action="module" data-id="review">进入审查中心</button><button class="btn small" data-action="run-control" data-value="upload">重新上报本阶段日志</button></div></section><div class="panel" style="margin-top:11px"><div class="panel-head"><div><h2>执行控制</h2><p>控制 Run，不改变 Task 正式状态</p></div></div><div class="panel-body"><div class="action-row"><button class="btn small" data-action="run-control" data-value="pause">模拟暂停</button><button class="btn small" data-action="run-control" data-value="resume">模拟恢复</button><button class="btn success small" data-action="offline-validate" ${canAct("offline-validate")?"":"disabled"}>完成离线回滚验证</button></div><div class="server-note" style="margin-top:8px">服务端存档为模拟数据：本地 Run 完成不等于 Trace 已被云端确认；只有确认后的 Evidence 才能进入正式决定。</div></div></div>`}
    function bind(root){root.querySelectorAll("[data-action]").forEach(x=>x.addEventListener("click",handle));root.querySelectorAll('[data-action="role-select"]').forEach(x=>x.addEventListener("change",handle));root.querySelectorAll('[data-action="select-stage"]').forEach(x=>x.addEventListener("click",()=>{run(state.selectedRun).selectedStage=x.dataset.id;render();focusStageLogs()}));root.querySelectorAll('[data-action="select-agent"]').forEach(x=>x.addEventListener("click",()=>{const r=run(state.selectedRun),s=r.stages.find(y=>y.agent===x.dataset.id);if(s)r.selectedStage=s.id;render();focusStageLogs()}));root.querySelectorAll('[data-action="log-filter"]').forEach(x=>x.addEventListener("click",()=>{state.logFilter=x.dataset.id;render();focusStageLogs()}))}
    const agentTone=s=>s.includes("失败")?"red":s.includes("等待")?"amber":s.includes("运行")?"blue":"green";
    function serverAgent(id){return state.serverAgents.find(x=>x.id===id)||state.serverAgents[0]}

    function agentStrip(ids,title,desc){return `<section class="panel agent-strip"><div class="panel-head"><div><h2>${title}</h2><p>${desc}</p></div>${badge("服务端准备 / 审查","blue")}</div><div class="agent-strip-grid">${ids.map(id=>{const a=serverAgent(id);return `<div class="agent-strip-card"><div>${badge(a.domain)} ${badge(a.status,agentTone(a.status))}</div><h3>${a.name}</h3><p>${a.capability}</p><div class="agent-current"><strong>${a.current}</strong>${a.output}</div><div class="action-row">${serverAgentLink(a.id,"查看 Agent 详情")}</div></div>`}).join("")}</div></section>`}
    function renderAgents(){const a=serverAgent(state.selectedServerAgent),ready=state.serverAgents.filter(x=>/完成|确认|发布/.test(x.status)).length,waiting=state.serverAgents.filter(x=>x.status.includes("等待")||x.status.includes("前置")).length;return `<div class="metrics"><div class="metric-card"><span>服务端 Agent</span><strong>${state.serverAgents.length}</strong><p>需求、规划、供给、审查、文档、知识与交付</p></div><div class="metric-card"><span>最近完成</span><strong>${ready}</strong><p>只表示 Agent 产物完成，不等于业务批准</p></div><div class="metric-card"><span>等待人工确认</span><strong>${waiting}</strong><p>人工卡点仍由对应责任角色完成</p></div><div class="metric-card"><span>本地执行边界</span><strong>0</strong><p>服务端 Agent 不执行真实代码与工具链</p></div></div><div class="agents-layout"><section class="panel agent-list"><div class="panel-head"><div><h2>服务端 Agent</h2><p>按能力域选择观测对象</p></div>${badge("云端","blue")}</div><div class="master-list">${state.serverAgents.map(x=>`<button class="master-item ${x.id===a.id?"active":""}" data-action="select-server-agent" data-id="${x.id}"><div class="meta-row">${badge(x.domain)}${badge(x.status,agentTone(x.status))}</div><h3>${x.name}</h3><p>${x.current}</p><small>最近产出：${x.artifacts[0]}</small></button>`).join("")}</div></section><section class="panel agent-detail" data-tour="server-agent-detail"><div class="agent-detail-head"><div><div>${badge(a.domain)} ${badge(a.status,agentTone(a.status))}</div><h2>${a.name}</h2><p>${a.capability}</p></div><div class="agent-detail-actions"><button class="btn small" data-action="server-agent-action" data-value="rerun">重新运行分析</button><button class="btn primary small" data-action="server-agent-action" data-value="refresh">刷新候选产物</button></div></div><div class="agent-section"><h3>当前输入与产出</h3><div class="agent-input-output"><div class="info"><h3>输入摘要</h3><strong>${a.input}</strong><p>关联版本：${a.current}</p></div><div class="info"><h3>产出摘要</h3><strong>${a.output}</strong><p>最近运行：${a.lastRun} ｜ 耗时 ${a.duration} ｜ ${a.trace} Trace</p></div></div><div class="agent-note">服务端 Agent 只生成候选、建议和检查结果；正式 Task、Review、Baseline、知识发布仍由人工责任角色确认。</div></div><div class="agent-section"><h3>关联对象</h3><div class="agent-links">${a.links.map(x=>serverObjectLink(a.id,x)).join("")}</div><p class="muted" style="margin-top:7px;font-size:9px">点击对象将进入对应治理模块，服务端 Agent 仍保持当前选中。</p></div><div class="agent-section"><h3>权限边界</h3><div class="boundary-grid"><div class="info"><h3>允许</h3><strong>${a.permissions}</strong></div><div class="info"><h3>禁止</h3><strong>${a.forbidden}</strong></div></div></div><div class="agent-section"><h3>人工卡点</h3><div class="status-row" style="padding-left:0;padding-right:0"><span>${a.gate}<small>Agent 产物完成后进入该责任角色队列</small></span>${badge("不可由 Agent 代办","amber")}</div></div><div class="agent-section"><h3>最近运行日志</h3><div class="agent-log-list">${a.logs.map(x=>`<div class="agent-log"><time>${x[0]}</time><strong>${x[1]}</strong><p>${x[2]}</p></div>`).join("")}</div></div></section></div>`}
    function renderGovernance(){const reqLabel=state.requirementApproved?"已确认":"待确认",planLabel=state.planApproved?"已确认":"待确认",contextLabel=state.contextReleased?`${currentContext()} 已发布`:"等待计划确认";return `<section class="panel governance-panel"><div class="panel-head"><div><h2>治理卡点与版本链</h2><p>候选产物先经过责任角色确认，再进入下一阶段；历史 Run 不会被回写。</p></div>${badge(`当前角色：${roleLabel(state.role)}`,"blue")}</div><div class="governance-grid"><div class="governance-step">${badge(reqLabel,state.requirementApproved?"green":"amber")}<h3>Requirement 分析候选</h3><p>REQ-231-017 R3 · 需求范围、验收标准与风险清单</p><div class="action-row"><button class="btn small" data-action="governance-action" data-value="${state.requirementApproved?"req-reopen":"req-approve"}" ${canAct(state.requirementApproved?"req-reopen":"req-approve")?"":"disabled"}>${state.requirementApproved?"重新打开卡点":"确认需求候选"}</button></div></div><div class="governance-step">${badge(planLabel,state.planApproved?"green":"amber")}<h3>Task Package 规划</h3><p>TP-231-017-v3 · 10 Tasks、依赖关系、责任角色与人工卡点</p><div class="action-row"><button class="btn small" data-action="governance-action" data-value="${state.planApproved?"plan-reopen":"plan-approve"}" ${canAct(state.planApproved?"plan-reopen":"plan-approve")?"":"disabled"}>${state.planApproved?"重新打开卡点":"确认 Task Package"}</button></div></div><div class="governance-step">${badge(contextLabel,state.contextReleased?"green":"amber")}<h3>Context Package 下发</h3><p>只注入已发布知识、授权目录和验证命令；版本变更会生成新 Context。</p><div class="action-row"><button class="btn small" data-action="governance-action" data-value="context-refresh" ${canAct("context-refresh")&&state.planApproved?"":"disabled"}>重新生成候选</button></div></div></div></section>`}
    function renderEvidenceGate(){const d=dec(state.selectedDecision),e=ev(d.evidence),needsAck=e.id==="EV-017-REG-04",ack=serverAcked("RUN-017-03"),evidenceReady=needsAck?ack:true;return `<section class="panel governance-panel"><div class="panel-head"><div><h2>Evidence 确认</h2><p>服务端 Trace 确认后，由 Evidence 责任人确认事实有效性，最后才进入 Review Decision。</p></div>${badge(e.valid,e.valid==="有效"?"green":"amber")}</div><div class="panel-body"><div class="status-row"><span>${e.id}<small>${e.conclusion} ｜ 来源：${e.source} ｜ Trace：${e.trace}</small></span>${badge(needsAck?(ack?"服务端已确认":"等待服务端确认"):"来源已关联",needsAck?(ack?"green":"amber"):"blue")}</div><div class="action-row"><button class="btn success small" data-action="evidence-action" data-value="confirm" ${e.valid==="有效"||!evidenceReady||!canRole(e.confirmer)?"disabled":""}>确认 Evidence 有效</button><span class="server-note">${e.valid==="有效"?"已确认，不需要重复确认。":needsAck&&!ack?"请先到执行中心完成 Trace 上报确认。":`由 ${e.confirmer} 核对来源后确认。`}</span></div></div></section>`}
    const renderTasksBase=renderTasks,renderExecutionBase=renderExecution,renderReviewBase=renderReview,renderDocumentsBase=renderDocuments,renderBaselineBase=renderBaseline,renderKnowledgeBase=renderKnowledge;
    renderTasks=()=>renderTasksBase()+renderGovernance()+agentStrip(["req-analysis","task-planning","context-package"],"任务总览 · 服务端协同","需求分析、任务规划与 Context Package 先形成版本化候选，再由责任角色确认。");
    renderExecution=()=>agentStrip(["task-planning","context-package","cloud-review"],"执行中心 · 云端协同","服务端 Agent 负责准备和审查，本地 Agent 负责真实代码、工具链、测试与环境执行。")+renderExecutionBase();
    renderReview=()=>agentStrip(["cloud-review"],"审查中心 · 云端审查 Agent","读取 Trace → Engineering Fact → Evidence，生成审查摘要；正式决定仍由人工责任人完成。")+renderReviewBase()+renderEvidenceGate();
    renderDocuments=()=>agentStrip(["doc-consistency"],"工程文档 · 文档一致性 Agent","按代码 Diff 和 Evidence 生成章节候选，不覆盖人工锁定内容。")+renderDocumentsBase();
    renderBaseline=()=>agentStrip(["delivery-baseline"],"交付基线 · 版本检查 Agent","输出源码、镜像、部署、文档、Evidence 和回滚缺失项；不拥有交付批准权。")+renderBaselineBase();
    renderKnowledge=()=>agentStrip(["knowledge-curator"],"知识库 · 知识整理 Agent","提取候选规则与效果反馈；只有知识管理员可以发布或停用知识。")+renderKnowledgeBase();
    function renderLocalContext(t){return `<div class="server-note">本地端可见上下文：${escapeHtml(currentContext())} · ${state.contextReleased?"已发布":"未发布"}。代码和工具只在本地执行；服务端只保存脱敏 Trace、事实和人工决定。</div><div class="context-grid" style="margin-top:10px"><div class="info wide"><h3>Requirement</h3><strong>${escapeHtml(DATA.project.req)} ${escapeHtml(DATA.project.reqVersion)}</strong><p>${escapeHtml(DATA.project.reqTitle)} · 验收：跨租户请求返回 403，镜像与离线包可回滚。</p></div><div class="info"><h3>授权代码范围</h3><strong class="mono">services/alert-rules</strong><p>允许修改：规则 API、TenantRuleFilter 与对应测试。</p></div><div class="info"><h3>验证命令</h3><strong class="mono">mvn-test · api-runner</strong><p>保留原失败用例与 18 项影响回归。</p></div><div class="info"><h3>工程文档</h3><strong>DOC-231-017-v3</strong><p>接口说明、租户隔离、测试说明、离线安装。</p></div><div class="info"><h3>已发布知识</h3><strong>KN-API-014</strong><p>公共契约变化会使执行包失效。</p></div></div><div class="detail-section"><h3>本地用户与 Agent 交互</h3><div class="chat-list">${state.localConversation.map(x=>`<div class="chat-entry ${x[0]==="本地用户"?"user":""}"><strong>${escapeHtml(x[0])}</strong><p>${escapeHtml(x[1])}</p></div>`).join("")}</div><div class="local-form"><textarea id="local-request" aria-label="发送给本地 Agent 的研发请求" placeholder="输入本地研发或审阅请求">检查本次 Diff 是否超出授权目录，并给出需要人工确认的风险。</textarea><button class="btn primary small" data-action="local-agent-run">运行本地 Agent</button></div><div class="action-row"><button class="btn small" data-action="upload-local">上报本地交互 Trace（${state.localTracePending} 条待上报）</button><button class="btn small" data-action="module" data-id="execution">查看本地 Run</button></div></div>`}
    const drawerWithContext=drawerContent;
    drawerContent=function(t){if(state.tab==="context")return renderLocalContext(t);return drawerWithContext(t)};
    const drawerContentBase=drawerContent;
    drawerContent=function(t){const out=drawerContentBase(t);if(state.tab!=="overview")return out;return out+`<div class="detail-section"><h3>服务端协同 Agent</h3><div class="agent-strip-card"><div>${serverAgentLink("req-analysis")} ${serverAgentLink("task-planning")} ${serverAgentLink("context-package")}</div><p style="margin-top:7px">需求分析 → 任务规划 → Context Package 版本链：服务端负责准备候选，本地 Agent 才在授权目录执行真实代码。</p></div></div>`};
    const shellBase=shell;
    shell=function(content){const m=MODULES[state.module];return `<aside class="sidebar"><div class="brand"><span class="brand-mark">H</span><span>智能软件工厂</span></div><div class="project-back">‹ 返回项目列表</div><div class="nav-title">任务与治理</div><nav class="side-nav">${navItem("tasks","01",state.tasks.length)}${navItem("execution","02",state.runs.length)}${navItem("review","03",state.decisions.filter(x=>!x.status.startsWith("已")).length)}${navItem("documents","04",state.chapters.filter(x=>x.status.includes("待")).length)}${navItem("baseline","05",state.baselineApproved?0:1)}${navItem("knowledge","06",state.knowledge.filter(x=>x.status==="待审核").length)}</nav><div class="nav-title">项目资产</div><nav class="side-nav">${navItem("agents","A",state.serverAgents.length)}<button class="side-item disabled"><span class="side-glyph">S</span><span>项目技能</span><span class="side-count">后续</span></button><button class="side-item disabled"><span class="side-glyph">R</span><span>项目规范</span><span class="side-count">后续</span></button></nav><div class="sidebar-foot">方案 A / Prototype / 不连接真实系统</div></aside><header class="topbar"><div class="crumbs"><strong>首页</strong><span>/</span><span>研发治理工作台</span><span>/</span><span>${m.name}</span></div><div class="top-actions"><span class="mock">演示数据</span><span class="avatar">张</span></div></header><main class="main"><section class="workspace-head" data-tour="requirement"><div><p class="kicker">${DATA.project.req} · ${DATA.project.reqVersion}</p><h1>${m.title}</h1><p>${m.desc} 当前需求：${DATA.project.reqTitle}</p></div><div class="head-actions"><button class="btn" data-action="reset">重置状态</button><button class="btn primary" data-action="start-tour">一键演示闭环</button></div></section>${summary()}${content}</main>`};
    const shellWithRole=shell;
    shell=function(content){const html=shellWithRole(content),roleControl=`<label class="role-switch">当前角色<select data-action="role-select" aria-label="当前角色">${ROLES.map(x=>`<option value="${x}" ${state.role===x?"selected":""}>${x}</option>`).join("")}</select></label>`;return html.replace(`<div class="top-actions"><span class="mock">演示数据</span><span class="avatar">张</span></div>`,`<div class="top-actions">${roleControl}<span class="mock">演示数据</span><span class="avatar">张</span></div>`).replace("方案 A / Prototype / 不连接真实系统","方案 A / Prototype / 模拟服务端存档")};
    const moduleContentBase=moduleContent;
    moduleContent=function(){if(state.module==="agents")return renderAgents();return moduleContentBase()};
    const handleBase=handle;
    handle=function(e){const el=e.currentTarget,a=el.dataset.action,id=el.dataset.id,v=el.dataset.value;if(a==="select-server-agent"){state.selectedServerAgent=id;navigateModule("agents");return}if(a==="server-object"){state.selectedServerAgent=id;const label=el.dataset.object||"";navigateModule(el.dataset.module||"agents");if(/^TASK/.test(label)||/^CTX/.test(label)){state.selectedTask=/^TASK/.test(label)?label:"TASK-1048";state.drawer=true;state.tab=/^CTX/.test(label)?"context":"overview";render();}if(/^RUN/.test(label)){state.selectedRun=label;render()}if(/^DEC/.test(label)||/^EV/.test(label)){state.selectedDecision=/^DEC/.test(label)?label:"DEC-01";render()}if(/^DOC-CH/.test(label)){state.selectedChapter=label;render()}if(/^KN/.test(label)){state.selectedKnowledge=label;render()}return}if(a==="server-agent-action"){if(!canAct("server-agent-action"))return deny("server-agent-action");const agent=serverAgent(state.selectedServerAgent),verb=v==="rerun"?"重新运行分析":"刷新候选产物";agent.status="已完成";agent.lastRun="刚刚 · 模拟运行";agent.trace++;agent.logs.push(["刚刚","项目管理员操作",`${verb}完成，生成新的候选运行记录；未改变正式 Task、Review、Baseline 或知识发布状态。`]);if(v==="refresh")agent.output=`${agent.output}（已刷新候选版本）`;recordServerEvent("agent-run",`${agent.name} ${verb}`,{agent:agent.id});show(`${agent.name}：${verb}完成。正式业务状态未改变。`);render();return}handleBase(e)};
    const current=new URLSearchParams(location.search);if(!MODULES[current.get("module")]){current.delete("variant");current.set("module","tasks");history.replaceState(null,"",`${location.pathname}?${current}`);state.module="tasks"}
    render();
  })();
  </script>
</body>
</html>
